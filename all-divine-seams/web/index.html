<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Between the Rooms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One visual world by choice: the Seams at night, rose-gold trim. */
:root {
  --ink: #07080f;
  --night: #121633;
  --gilt: #c9a35d;
  --rose: #e8607e;
  --cream: #f6ecd4;
  --dim: #6c739c;
  --font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 30%, #1a1f45 0%, var(--ink) 70%);
  color: var(--cream);
  font: 12px/1.4 var(--font);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
#app {
  position: relative;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#screen {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #05060c;
  box-shadow: 0 0 0 1px #2a2f5a, 0 0 0 3px #0a0c1c, 0 0 0 4px var(--gilt), 0 18px 60px rgba(0, 0, 0, 0.6);
  outline: none;
  touch-action: none;
  max-width: 100%;
}
</style>
<div id="app">
  <div id="stage"><canvas id="screen" tabindex="0" aria-label="Between the Rooms"></canvas></div>
  <div id="controls" aria-hidden="true"></div>
</div>
<script>
// ---- src/engine/core.js
// Core: display size, loop, scene stack, storage, error log. Everything hangs off the one global, AD.
// Carried over from All-Divine Tactics; the screen size is no longer fixed, and nothing here knows
// about battles. Input lives in engine/input.js.
window.AD = window.AD || {};
(function (AD) {
  'use strict';
  AD.VERSION = '0.1.0';
  AD.frame = 0;
  AD.paused = false;

  // ---------------------------------------------------------------- display
  // hd: the GBA's 3:2 shape at 1.5x its resolution, with Tactics' 24 px art. gba: the real thing.
  const MODES = { hd: { W: 360, H: 240, T: 24 }, gba: { W: 240, H: 160, T: 16 } };
  AD.display = {
    mode: 'hd', W: 360, H: 240, T: 24, onChange: [],
    set(mode) {
      const m = MODES[mode];
      if (!m) return;
      this.mode = mode; this.W = m.W; this.H = m.H; this.T = m.T;
      AD.W = m.W; AD.H = m.H;
      if (AD.canvas) { AD.canvas.width = m.W; AD.canvas.height = m.H; AD.ctx.imageSmoothingEnabled = false; }
      this.onChange.forEach((fn) => { try { fn(mode); } catch (e) { AD.report(e, 'display'); } });
      if (AD.fit) AD.fit();
    },
  };
  AD.W = 360; AD.H = 240;

  // ---------------------------------------------------------------- utils
  AD.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  AD.lerp = (a, b, t) => a + (b - a) * t;
  AD.ease = (t) => t * t * (3 - 2 * t);
  AD.timers = [];
  AD.wait = (frames) => new Promise((res) => AD.timers.push({ t: frames, res }));
  AD.deep = (o) => JSON.parse(JSON.stringify(o));

  // ---------------------------------------------------------------- storage
  // localStorage can be missing or throw (private windows, sandboxed previews); every access is
  // guarded and the game runs without it. Keys are prefixed so Tactics' saves are never touched.
  AD.store = {
    get(key) {
      try { const v = window.localStorage.getItem('seams.' + key); return v ? JSON.parse(v) : null; }
      catch (e) { return null; }
    },
    set(key, val) {
      try { window.localStorage.setItem('seams.' + key, JSON.stringify(val)); return true; }
      catch (e) { return false; }
    },
    raw(key) { try { return window.localStorage.getItem('seams.' + key); } catch (e) { return null; } },
    setRaw(key, s) { try { window.localStorage.setItem('seams.' + key, s); return true; } catch (e) { return false; } },
    del(key) { try { window.localStorage.removeItem('seams.' + key); } catch (e) { /* ignore */ } },
  };

  // ---------------------------------------------------------------- errors
  // Every error the game survives is kept (the last 30, in storage too), so a problem on a phone
  // can be reported: Settings > Report a problem copies the log.
  AD.errlog = AD.store.get('errlog') || [];
  const sceneName = (s) => (s ? Object.keys(AD).find((k) => AD[k] === s.constructor) || s.constructor.name || '?' : '-');
  AD.sceneName = sceneName;
  AD.report = function (e, where) {
    try {
      const msg = String((e && e.message) || e);
      const stack = String((e && e.stack) || '').split('\n').slice(1, 4).map((l) => l.trim()).join(' | ');
      const run = AD.play && AD.play.run;
      AD.errlog.push({
        at: new Date().toISOString(), where: where || '', msg, stack,
        scenes: AD.stack.map(sceneName).join('>'),
        run: run ? 'd' + run.depth + ' ' + (run.room ? run.room.key : '') : '',
      });
      if (AD.errlog.length > 30) AD.errlog.splice(0, AD.errlog.length - 30);
      AD.store.set('errlog', AD.errlog);
    } catch (e2) { /* the log must never throw */ }
    if (typeof console !== 'undefined') console.error(e);
  };
  AD.settle = (p, fn) => Promise.resolve(p).catch((e) => AD.report(e, 'flow')).then(fn);
  if (window.addEventListener) {
    window.addEventListener('error', (ev) => AD.report(ev.error || ev.message, 'window'));
    window.addEventListener('unhandledrejection', (ev) => AD.report(ev.reason, 'promise'));
  }

  // ---------------------------------------------------------------- scenes
  // A stack: the top scene updates; every scene down to the last opaque one draws.
  AD.stack = [];
  const clearInput = () => { if (AD.input && AD.input.clear) AD.input.clear(); };
  AD.push = function (scene) {
    AD.stack.push(scene);
    scene.enter && scene.enter();
    clearInput();
    return scene;
  };
  AD.pop = function (scene) {
    const i = scene ? AD.stack.lastIndexOf(scene) : AD.stack.length - 1;
    if (i < 0) return;
    const [s] = AD.stack.splice(i, 1);
    s.exit && s.exit();
    clearInput();
  };
  AD.top = () => AD.stack[AD.stack.length - 1];
  // replace everything, through a fade
  AD.goto = function (scene, opts) {
    opts = opts || {};
    return AD.fade.out(opts.speed || 10).then(() => {
      while (AD.stack.length) AD.pop();
      AD.push(scene);
      return AD.fade.in(opts.speed || 10);
    });
  };
  // push a scene and resolve when it pops itself with scene.done(value)
  AD.run = function (scene) {
    return new Promise((res) => {
      scene.done = (v) => { AD.pop(scene); res(v); };
      AD.push(scene);
    });
  };

  AD.fade = {
    a: 0, target: 0, speed: 0, res: null, color: '#05060c',
    out(frames) { return this.to(1, frames); },
    in(frames) { return this.to(0, frames); },
    to(t, frames) {
      return new Promise((res) => {
        this.target = t; this.speed = 1 / Math.max(1, frames || 10);
        if (this.res) this.res();
        this.res = res;
      });
    },
    update() {
      // already there (a fade to black while black): settle on the next frame instead of never
      if (this.a === this.target && this.res) { const r = this.res; this.res = null; r(); }
      else if (this.a !== this.target) {
        this.a += Math.sign(this.target - this.a) * this.speed;
        if (Math.abs(this.a - this.target) <= this.speed) {
          this.a = this.target;
          const r = this.res; this.res = null; r && r();
        }
      }
    },
  };

  // A scene that throws every frame would hold the screen still forever. After a few failures in
  // a row it is closed instead: a pushed scene resolves as cancelled; anything else falls back to
  // the Garden, or the title.
  AD.rescue = function (scene, why) {
    AD.report(new Error((why || 'scene failed') + ': closed ' + sceneName(scene)), 'rescue');
    const i = AD.stack.indexOf(scene);
    if (i > 0) {
      if (scene.done) { try { scene.done(null); } catch (e) { AD.pop(scene); } } else AD.pop(scene);
      if (AD.stack.indexOf(scene) >= 0) AD.pop(scene);
      return;
    }
    if (AD.Garden && !(scene instanceof AD.Garden)) AD.goto(new AD.Garden());
    else if (AD.Title) AD.goto(new AD.Title());
  };
  function failed(scene, e, what) {
    AD.report(e, what + ' ' + sceneName(scene));
    scene.__fails = (scene.__fails || 0) + 1;
    if (scene.__fails >= 8) { scene.__fails = 0; AD.rescue(scene, what + ' kept throwing'); }
  }

  // ---------------------------------------------------------------- loop
  let acc = 0, last = 0;
  function step() {
    AD.frame++;
    if (AD.input && AD.input.update) AD.input.update();
    for (let i = AD.timers.length - 1; i >= 0; i--) {
      if (--AD.timers[i].t <= 0) { const t = AD.timers.splice(i, 1)[0]; t.res(); }
    }
    AD.fade.update();
    const top = AD.top();
    if (top && top.update) {
      try { top.update(); top.__fails = 0; } catch (e) { failed(top, e, 'update'); }
    }
    if (AD.input && AD.input.endFrame) AD.input.endFrame();
    AD.fx && AD.fx.update && AD.fx.update();
    AD.audio && AD.audio.tick && AD.audio.tick();
  }

  function render() {
    const ctx = AD.ctx;
    if (!ctx) return;
    const W = AD.display.W, H = AD.display.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05060c';
    ctx.fillRect(0, 0, W, H);
    let from = 0;
    for (let i = AD.stack.length - 1; i >= 0; i--) { if (AD.stack[i].opaque) { from = i; break; } }
    for (let i = from; i < AD.stack.length; i++) {
      const s = AD.stack[i];
      ctx.save();
      try { s.draw && s.draw(ctx); } catch (e) { failed(s, e, 'draw'); }
      ctx.restore();
    }
    if (AD.fade.a > 0) {
      ctx.globalAlpha = AD.fade.a;
      ctx.fillStyle = AD.fade.color;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }
  AD.render = render;

  // frame time of the last few frames (ms), for the slow-device suggestion
  AD.frameMs = [];
  let loopErrors = 0;
  function loop(t) {
    // schedule first: an exception in one frame must not stop every frame after it
    requestAnimationFrame(loop);
    if (!last) last = t;
    let dt = t - last; last = t;
    if (dt > 250) dt = 250;
    acc += dt;
    let n = 0;
    try {
      const t0 = performance.now();
      while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
      if (n === 4) acc = 0;
      render();
      AD.frameMs.push(performance.now() - t0);
      if (AD.frameMs.length > 300) AD.frameMs.shift();
    } catch (e) {
      acc = 0;
      if (loopErrors++ < 5) AD.report(e, 'loop');
    }
  }

  // test hook: advance the simulation by hand (a hidden tab gets no animation frames)
  AD.debugStep = function (n) {
    for (let i = 0; i < (n || 1); i++) step();
    render();
    return AD.stack.map(sceneName);
  };

  // ---------------------------------------------------------------- boot
  AD.boot = function (start) {
    const cv = document.getElementById('screen');
    AD.canvas = cv;
    AD.ctx = cv.getContext('2d');
    cv.width = AD.display.W; cv.height = AD.display.H;
    AD.ctx.imageSmoothingEnabled = false;
    AD.fit = () => {
      const wrap = document.getElementById('stage');
      if (!wrap) return;
      const r = wrap.getBoundingClientRect();
      const W = AD.display.W, H = AD.display.H;
      const s = Math.min(r.width / W, r.height / H);
      if (!(s > 0)) return;
      // integer scale when there is room, so pixels stay square and even
      const k = s >= 2 ? Math.floor(s) : s;
      cv.style.width = Math.floor(W * k) + 'px';
      cv.style.height = Math.floor(H * k) + 'px';
    };
    window.addEventListener('resize', AD.fit);
    if (window.ResizeObserver) new ResizeObserver(AD.fit).observe(document.getElementById('stage'));
    AD.fit();
    if (AD.input && AD.input.bind) AD.input.bind(cv);
    start();
    requestAnimationFrame(loop);
  };
})(window.AD);
// ---- src/engine/gfx.js
// Graphics: bitmap font, windows, icons, colour helpers, and the diorama post-effects
// (light pools, bloom, tilt-shift blur, vignette, weather).
(function (AD) {
  'use strict';
  let W = AD.display.W, H = AD.display.H;
  const G = (AD.gfx = {});

  // ---------------------------------------------------------------- palette
  G.C = {
    ink: '#0b0e1c', night: '#141a36', navy: '#1d2550', indigo: '#2b3473', slate: '#4a5390',
    gold: '#e8c170', goldD: '#a2783a', rose: '#e8607e', roseD: '#8e2f4a', cream: '#f6ecd4',
    gray: '#9aa1c4', dim: '#626a96', blue: '#5b9cf5', red: '#ef5858', green: '#58c97a',
    hp: '#7be88f', hpLow: '#ef5858', teal: '#5fd4c8', violet: '#a98cf0', white: '#ffffff',
  };

  G.rgb = function (hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  G.hex = (r, g, b) => '#' + [r, g, b].map((v) => AD.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  // amt > 0 lightens toward white, < 0 darkens toward black
  G.shade = function (hex, amt) {
    const [r, g, b] = G.rgb(hex);
    if (amt >= 0) return G.hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return G.hex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  };
  G.mix = function (a, b, t) {
    const A = G.rgb(a), B = G.rgb(b);
    return G.hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  };
  G.canvas = function (w, h, readBack) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    // a canvas whose pixels are read every frame lives in memory, not on the GPU
    const x = c.getContext('2d', readBack ? { willReadFrequently: true } : undefined);
    x.imageSmoothingEnabled = false;
    c.x = x;
    return c;
  };

  // ---------------------------------------------------------------- font
  // 5x9 cells: rows 0-6 sit on the baseline, rows 7-8 are descenders. Widths trim automatically.
  const F = {
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    B: ['####.', '#...#', '#...#', '####.', '#...#', '#...#', '####.'],
    C: ['.###.', '#...#', '#....', '#....', '#....', '#...#', '.###.'],
    D: ['####.', '#...#', '#...#', '#...#', '#...#', '#...#', '####.'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    F: ['#####', '#....', '#....', '####.', '#....', '#....', '#....'],
    G: ['.###.', '#...#', '#....', '#.###', '#...#', '#...#', '.####'],
    H: ['#...#', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    I: ['###', '.#.', '.#.', '.#.', '.#.', '.#.', '###'],
    J: ['..###', '...#.', '...#.', '...#.', '#..#.', '#..#.', '.##..'],
    K: ['#...#', '#..#.', '#.#..', '##...', '#.#..', '#..#.', '#...#'],
    L: ['#....', '#....', '#....', '#....', '#....', '#....', '#####'],
    M: ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#'],
    N: ['#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#', '#...#'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
    P: ['####.', '#...#', '#...#', '####.', '#....', '#....', '#....'],

    R: ['####.', '#...#', '#...#', '####.', '#.#..', '#..#.', '#...#'],

    T: ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],

        d[i] *= k; d[i + 1] *= k; d[i + 2] *= k; d[i + 3] = 255;
      }
      small.x.putImageData(id, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = opt.bloomAmt || 0.55;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(small, -2, -2, W + 4, H + 4);
      ctx.restore();
      ctx.imageSmoothingEnabled = false;
    }
    if (opt.vignette !== false) ctx.drawImage(vign, 0, 0);
  };
})(window.AD);

// ---- src/art/raster.js
// Ras: a small pixel raster that sprites are painted into, then turned into a canvas.
// Carried over from All-Divine Tactics (sprites.js).
(function (AD) {
  'use strict';
  const G = AD.gfx;
  const S = (AD.spr = AD.spr || {});
  function Ras(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  Ras.prototype.set = function (x, y, c) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h || !c) return;
    this.d[y * this.w + x] = c;
  };
  Ras.prototype.get = function (x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.d[y * this.w + x];
  };
  Ras.prototype.clear = function (x, y) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.d[y * this.w + x] = null; };
  Ras.prototype.rect = function (x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, c); };
  Ras.prototype.row = function (y, x0, x1, c) { for (let i = x0; i <= x1; i++) this.set(i, y, c); };
  Ras.prototype.col = function (x, y0, y1, c) { for (let j = y0; j <= y1; j++) this.set(x, j, c); };
  Ras.prototype.ellipse = function (cx, cy, rx, ry, c, clip) {
    for (let j = Math.floor(cy - ry - 1); j <= Math.ceil(cy + ry + 1); j++) {
      for (let i = Math.floor(cx - rx - 1); i <= Math.ceil(cx + rx + 1); i++) {
        const dx = (i + 0.5 - cx) / rx, dy = (j + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1 && (!clip || clip(i, j))) this.set(i, j, c);
      }
    }
  };
  Ras.prototype.poly = function (pts, c) {
    let minY = Infinity, maxY = -Infinity;
    pts.forEach((p) => { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      const xs = [];
      const yc = y + 0.5;
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + ((yc - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
      }
      xs.sort((p, q) => p - q);
      for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) this.set(x, y, c);
    }
  };
  Ras.prototype.line = function (x0, y0, x1, y1, c) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
    for (let i = 0; i <= n; i++) this.set(Math.round(x0 + ((x1 - x0) * i) / n), Math.round(y0 + ((y1 - y0) * i) / n), c);
  };
  // darken edges that face down/right, light the ones facing up/left
  Ras.prototype.shade = function (amt, keep) {
    const src = this.d.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = src[y * this.w + x];
      if (!c || (keep && keep[c])) continue;
      const r = src[y * this.w + x + 1], b = y + 1 < this.h ? src[(y + 1) * this.w + x] : null;
      const l = x > 0 ? src[y * this.w + x - 1] : null, t = y > 0 ? src[(y - 1) * this.w + x] : null;
      if ((x + 1 >= this.w || !r) || !b) this.d[y * this.w + x] = G.shade(c, -amt);
      else if (!l || !t) this.d[y * this.w + x] = G.shade(c, amt * 0.6);
    }
  };
  Ras.prototype.outline = function (col) {
    const src = this.d.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (src[y * this.w + x]) continue;
      const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
        const xx = x + dx, yy = y + dy;
        return xx >= 0 && yy >= 0 && xx < this.w && yy < this.h && src[yy * this.w + xx];
      });
      if (n) this.d[y * this.w + x] = col || OUT;
    }
  };
  Ras.prototype.flip = function () {
    const r = new Ras(this.w, this.h);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) r.d[y * this.w + x] = this.d[y * this.w + (this.w - 1 - x)];
    return r;
  };
  Ras.prototype.canvas = function () {
    const c = G.canvas(this.w, this.h);
    const id = c.x.createImageData(this.w, this.h);
    const cache = {};
    for (let i = 0; i < this.d.length; i++) {
      const col = this.d[i];
      if (!col) continue;
      const rgb = cache[col] || (cache[col] = G.rgb(col));
      id.data[i * 4] = rgb[0]; id.data[i * 4 + 1] = rgb[1]; id.data[i * 4 + 2] = rgb[2]; id.data[i * 4 + 3] = 255;
    }
    c.x.putImageData(id, 0, 0);
    return c;
  };
  S.Ras = Ras;
})(window.AD);
