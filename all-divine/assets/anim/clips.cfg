; Task 14c: the blade Knuckle's four moves, cut from the sword clips of UAL2 (his sword is the model's Knuckle_Blade).
; The warps are (seconds in the move, seconds in the source): the cut and the chop are drawn out to a wind-up the
; tell can show; the three sword swings play smooth (they travel too far a step to be shown at 12 fps without a pop); the backcut is the source's own timing to its blow; the lunge is the
; thrust's Sword_Dash with the thrust's warp, so the same catch pair meets it.
