; The three builds CI makes (.github/workflows/all-divine.yml) and tools/godot.sh can make:
;   tools/godot.sh --export-release "Linux" out/linux/all-divine.x86_64
; tests/ and tools/ stay out of every build: nothing the game loads is in either. core/self_test.gd (the first
; autoload) uses TestLogger, which is why that lives in core/test_logger.gd (tests/tools/test_export_presets.gd).

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="out/linux/all-divine.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false

