<title>All-Divine Tactics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One dark visual world: the Tanneries at night, rose-gold trim. Single theme by choice. */
:root {
  --ink: #07080f;
  --night: #121633;
  --gilt: #c9a35d;
  --rose: #e8607e;
  --cream: #f6ecd4;
  --dim: #6c739c;
  --font: ui-monospace, "Cascadia Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 30%, #1a1f45 0%, var(--ink) 70%);
  color: var(--cream);
  font: 12px/1.4 var(--font);
  overflow: hidden;
}
#app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
#screen {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #05060c;
  box-shadow: 0 0 0 1px #2a2f5a, 0 0 0 3px #0a0c1c, 0 0 0 4px var(--gilt), 0 18px 60px rgba(0, 0, 0, 0.6);
  outline: none;
  touch-action: none;
  max-width: 100%;
}
#screen:focus-visible { box-shadow: 0 0 0 1px #2a2f5a, 0 0 0 3px #0a0c1c, 0 0 0 4px var(--rose); }
#keys { margin: 0; color: var(--dim); text-align: center; max-width: 72ch; }
#codebox {
  width: min(560px, 100%);
  height: 64px;
  background: var(--night);
  color: var(--cream);
  border: 1px solid var(--gilt);
  font: 11px/1.3 var(--font);
  box-sizing: border-box;
}
#pad { display: none; width: 100%; max-width: 520px; justify-content: space-between; align-items: center; gap: 8px; user-select: none; -webkit-user-select: none; }
#pad button {
  background: #1a2050;
  color: var(--cream);
  border: 1px solid var(--gilt);
  border-radius: 8px;
  font: 13px var(--font);
  touch-action: none;
}
#pad button.down { background: var(--rose); }
.dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 2px; }
.dpad .u { grid-column: 2; grid-row: 1; }
.dpad .l { grid-column: 1; grid-row: 2; }
.dpad .r { grid-column: 3; grid-row: 2; }
.dpad .d { grid-column: 2; grid-row: 3; }
.mid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; flex: 1; max-width: 190px; }
.mid .sm { height: 30px; font-size: 10px; }
.ab { display: flex; gap: 10px; align-items: center; }
.ab .a, .ab .b { width: 58px; height: 58px; border-radius: 50%; font-size: 18px; }
.ab .a { transform: translateY(-14px); background: #3a2050; }
@media (pointer: coarse) {
  #pad { display: flex; }
  #keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #screen { box-shadow: 0 0 0 1px #2a2f5a, 0 0 0 4px var(--gilt); }
}

</style>
<main id="app">
  <div id="stage"><canvas id="screen" width="320" height="180" tabindex="0" aria-label="The All-Divine: Tactics of the Open Hand. Use the keyboard, mouse, a gamepad, or the touch buttons."></canvas></div>
  <div id="pad" aria-hidden="true">
    <div class="dpad">
      <button data-btn="up" class="u">&#x25b2;</button><button data-btn="left" class="l">&#x25c0;</button><button data-btn="right" class="r">&#x25b6;</button><button data-btn="down" class="d">&#x25bc;</button>
    </div>
    <div class="mid"><button data-btn="l" class="sm">L</button><button data-btn="start" class="sm">MENU</button><button data-btn="r" class="sm">R</button><button data-btn="x" class="sm">INFO</button><button data-btn="y" class="sm">DANGER</button><button data-btn="fast" class="sm">FAST</button></div>
    <div class="ab"><button data-btn="b" class="b">B</button><button data-btn="a" class="a">A</button></div>
  </div>
  <p id="keys">Arrows/WASD move &#xb7; Z confirm &#xb7; X back &#xb7; C info &#xb7; F danger zone &#xb7; Q/E cycle &#xb7; P menu &#xb7; hold Shift to fast-forward &#xb7; mouse and gamepad work too</p>
  <textarea id="codebox" hidden spellcheck="false" aria-label="Save code"></textarea>
</main>
<script>
// ---- js/core.js
// Core: loop, scene stack, input, RNG, storage. Everything hangs off the one global, AD.
window.AD = window.AD || {};
(function (AD) {
  'use strict';
  const W = 320, H = 180;
  AD.W = W; AD.H = H; AD.TILE = 16;
  AD.frame = 0;

  // ---------------------------------------------------------------- utils
  AD.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  AD.lerp = (a, b, t) => a + (b - a) * t;
  AD.ease = (t) => t * t * (3 - 2 * t);
  AD.wait = (frames) => (AD.TEST ? Promise.resolve() : new Promise((res) => AD.timers.push({ t: frames, res })));
  AD.timers = [];
  AD.deep = (o) => JSON.parse(JSON.stringify(o));
  AD.pick = (arr, r) => arr[Math.floor((r === undefined ? Math.random() : r) * arr.length)];

  // seeded RNG (mulberry32); battles use AD.rng so a save replays the same rolls
  AD.makeRng = function (seed) {
    let a = seed >>> 0;
    const f = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.seed = () => a;
    return f;
  };
  AD.rng = AD.makeRng((Date.now() ^ 0x9e3779b9) >>> 0);
  AD.rn100 = () => Math.floor(AD.rng() * 100);

  // ---------------------------------------------------------------- storage
  // localStorage can be missing or throw (private windows, sandboxed previews); every access is
  // guarded and the game runs without it. Export/import codes are the portable fallback.
  AD.store = {
    get(key) {
      try { const v = window.localStorage.getItem('alldivine.' + key); return v ? JSON.parse(v) : null; }
      catch (e) { return null; }
    },
    set(key, val) {
      try { window.localStorage.setItem('alldivine.' + key, JSON.stringify(val)); return true; }
      catch (e) { return false; }
    },
    del(key) { try { window.localStorage.removeItem('alldivine.' + key); } catch (e) { /* ignore */ } },
    encode(obj) { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); },
    decode(str) {
      try { return JSON.parse(decodeURIComponent(escape(atob(str.trim())))); } catch (e) { return null; }
    },
  };

  // ---------------------------------------------------------------- input
  const KEYMAP = {
    ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down',
    ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
    z: 'a', Z: 'a', j: 'a', J: 'a', Enter: 'a', ' ': 'a',
    x: 'b', X: 'b', k: 'b', K: 'b', Escape: 'b', Backspace: 'b',
    c: 'x', C: 'x', i: 'x', I: 'x',
    f: 'y', F: 'y', v: 'y', V: 'y',
    q: 'l', Q: 'l', e: 'r', E: 'r', Tab: 'r',
    p: 'start', P: 'start', m: 'start', M: 'start',
    Shift: 'fast',
  };
  const BTN = ['up', 'down', 'left', 'right', 'a', 'b', 'x', 'y', 'l', 'r', 'start', 'fast'];
  const inp = {
    held: {}, prev: {}, cnt: {}, src: { key: {}, pad: {}, touch: {} }, latch: {},
    mouse: { x: -1, y: -1, over: false, moved: false, lastMove: 0 },
    click: null, rclick: false, wheel: 0, anyKey: false, lastDevice: 'key',
  };
  BTN.forEach((b) => { inp.held[b] = false; inp.prev[b] = false; inp.cnt[b] = 0; });
  AD.input = inp;
  inp.pressed = (b) => inp.held[b] && !inp.prev[b];
  inp.released = (b) => !inp.held[b] && inp.prev[b];
  // pressed, then auto-repeat while held (for cursors and menus)
  inp.rep = (b) => inp.held[b] && (inp.cnt[b] === 1 || (inp.cnt[b] > 14 && inp.cnt[b] % 4 === 0));
  inp.dir = function () {
    if (inp.rep('up')) return [0, -1];
    if (inp.rep('down')) return [0, 1];
    if (inp.rep('left')) return [-1, 0];
    if (inp.rep('right')) return [1, 0];
    return null;
  };
  inp.consumeClick = function () { const c = inp.click; inp.click = null; return c; };
  inp.clear = function () {
    BTN.forEach((b) => { inp.prev[b] = inp.held[b]; inp.cnt[b] = inp.held[b] ? 99 : 0; });
    inp.click = null; inp.rclick = false;
  };

  function onKey(e, down) {
    const b = KEYMAP[e.key];
    if (!b) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    inp.src.key[b] = down;
    // a tap shorter than one frame still counts as a press
    if (down && !e.repeat) inp.latch[b] = true;
    if (down) { inp.anyKey = true; inp.lastDevice = 'key'; AD.audio && AD.audio.unlock(); }
  }

  function canvasPos(ev) {
    const r = AD.canvas.getBoundingClientRect();
    return {
      x: Math.floor(((ev.clientX - r.left) / r.width) * W),
      y: Math.floor(((ev.clientY - r.top) / r.height) * H),
    };
  }

  function bindPointer(cv) {
    cv.addEventListener('mousemove', (ev) => {
      const p = canvasPos(ev);
      inp.mouse.x = p.x; inp.mouse.y = p.y; inp.mouse.over = true;
      inp.mouse.moved = true; inp.mouse.lastMove = AD.frame; inp.lastDevice = 'mouse';
    });
    cv.addEventListener('mouseleave', () => { inp.mouse.over = false; });
    cv.addEventListener('mousedown', (ev) => {
      AD.audio && AD.audio.unlock();
      if (ev.button === 0) { const p = canvasPos(ev); inp.click = p; inp.lastDevice = 'mouse'; }
      if (ev.button === 2) inp.rclick = true;
    });
    cv.addEventListener('contextmenu', (ev) => ev.preventDefault());
    cv.addEventListener('wheel', (ev) => { inp.wheel += Math.sign(ev.deltaY); ev.preventDefault(); },
      { passive: false });
    cv.addEventListener('touchstart', (ev) => {
      AD.audio && AD.audio.unlock();
      const t = ev.changedTouches[0];
      const p = canvasPos(t);
      inp.mouse.x = p.x; inp.mouse.y = p.y; inp.mouse.moved = true; inp.mouse.lastMove = AD.frame;
      inp.click = p; inp.lastDevice = 'touch';
      ev.preventDefault();
    }, { passive: false });
  }

  function bindTouchPad() {
    document.querySelectorAll('[data-btn]').forEach((el) => {
      const b = el.getAttribute('data-btn');
      const on = (ev) => { ev.preventDefault(); AD.audio && AD.audio.unlock(); inp.src.touch[b] = true; inp.latch[b] = true; el.classList.add('down'); inp.lastDevice = 'touch'; };
      const off = (ev) => { ev.preventDefault(); inp.src.touch[b] = false; el.classList.remove('down'); };
      el.addEventListener('pointerdown', on);
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('pointerleave', off);
    });
  }

  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const p = pads && Array.from(pads).find((g) => g && g.connected);
    const s = inp.src.pad;
    BTN.forEach((b) => { s[b] = false; });
    if (!p) return;
    const bt = (i) => p.buttons[i] && p.buttons[i].pressed;
    s.a = bt(0); s.b = bt(1); s.x = bt(2); s.y = bt(3); s.l = bt(4); s.r = bt(5);
    s.start = bt(9) || bt(8); s.fast = bt(7);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    s.up = bt(12) || ay < -0.5; s.down = bt(13) || ay > 0.5;
    s.left = bt(14) || ax < -0.5; s.right = bt(15) || ax > 0.5;
    if (BTN.some((b) => s[b])) { inp.lastDevice = 'pad'; AD.audio && AD.audio.unlock(); }
  }

  function updateInput() {
    pollPad();
    BTN.forEach((b) => {
      inp.prev[b] = inp.held[b];
      const latched = inp.latch[b];
      inp.latch[b] = false;
      // a latched tap that was already released forces one frame of "up" first, so it reads as a fresh press
      if (latched && inp.prev[b] && !inp.src.key[b] && !inp.src.touch[b]) inp.prev[b] = false;
      inp.held[b] = !!(inp.src.key[b] || inp.src.pad[b] || inp.src.touch[b] || latched);
      inp.cnt[b] = inp.held[b] ? (latched && !inp.prev[b] ? 1 : inp.cnt[b] + 1) : 0;
    });
  }

  // ---------------------------------------------------------------- scenes
  // A stack: the top scene updates; every scene down to the last opaque one draws.
  AD.stack = [];
  AD.push = function (scene) {
    AD.stack.push(scene);
    scene.enter && scene.enter();
    inp.clear();
    return scene;
  };
  AD.pop = function (scene) {
    const i = scene ? AD.stack.lastIndexOf(scene) : AD.stack.length - 1;
    if (i < 0) return;
    const [s] = AD.stack.splice(i, 1);
    s.exit && s.exit();
    inp.clear();
  };
  AD.top = () => AD.stack[AD.stack.length - 1];
  // replace everything, through a fade
  AD.goto = function (scene, opts) {
    opts = opts || {};
    return AD.fade.out(opts.speed || 14).then(() => {
      while (AD.stack.length) AD.pop();
      AD.push(scene);
      return AD.fade.in(opts.speed || 14);
    });
  };
  // push a scene and resolve when it pops itself with scene.done(value)
  AD.run = function (scene) {
    return new Promise((res) => {
      scene.done = (v) => { AD.pop(scene); res(v); };
      AD.push(scene);
    });
  };

  AD.fade = {
    a: 0, target: 0, speed: 0, res: null, color: '#05060c',
    out(frames) { return this.to(1, frames); },
    in(frames) { return this.to(0, frames); },
    to(t, frames) {
      return new Promise((res) => {
        this.target = t; this.speed = 1 / Math.max(1, frames || 14);
        if (this.res) this.res();
        this.res = res;
      });
    },
    update() {
      if (this.a !== this.target) {
        this.a += Math.sign(this.target - this.a) * this.speed;
        if (Math.abs(this.a - this.target) <= this.speed) {
          this.a = this.target;
          const r = this.res; this.res = null; r && r();
        }
      }
    },
  };

  // ---------------------------------------------------------------- loop
  let acc = 0, last = 0;
  function step() {
    AD.frame++;
    updateInput();
    for (let i = AD.timers.length - 1; i >= 0; i--) {
      if (--AD.timers[i].t <= 0) { const t = AD.timers.splice(i, 1)[0]; t.res(); }
    }
    AD.fade.update();
    const top = AD.top();
    if (top && top.update) top.update();
    if (inp.rclick) inp.rclick = false;
    inp.mouse.moved = false;
    inp.wheel = 0;
    AD.fx && AD.fx.update();
    AD.audio && AD.audio.tick();
  }

  function render() {
    const ctx = AD.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05060c';
    ctx.fillRect(0, 0, W, H);
    let from = 0;
    for (let i = AD.stack.length - 1; i >= 0; i--) { if (AD.stack[i].opaque) { from = i; break; } }
    for (let i = from; i < AD.stack.length; i++) {
      ctx.save();
      AD.stack[i].draw && AD.stack[i].draw(ctx);
      ctx.restore();
    }
    if (AD.fade.a > 0) {
      ctx.globalAlpha = AD.fade.a;
      ctx.fillStyle = AD.fade.color;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function loop(t) {
    if (!last) last = t;
    let dt = t - last; last = t;
    if (dt > 250) dt = 250;
    // fast-forward: holding the fast button runs the simulation at triple speed
    const speed = inp.held.fast ? 3 : 1;
    acc += dt * speed;
    let n = 0;
    while (acc >= 1000 / 60 && n < 8) { step(); acc -= 1000 / 60; n++; }
    render();
    requestAnimationFrame(loop);
  }

  // test hook: advance the simulation by hand (a hidden tab gets no animation frames)
  AD.debugStep = function (n, press) {
    for (let i = 0; i < (n || 1); i++) {
      if (press && i === 0) inp.src.key[press] = true;
      if (press && i === 2) inp.src.key[press] = false;
      step();
    }
    render();
    return AD.stack.map((s) => Object.keys(AD).find((k) => AD[k] === s.constructor) || s.constructor.name || '?');
  };
  AD.debugClick = function (x, y) { inp.click = { x, y }; inp.mouse.x = x; inp.mouse.y = y; inp.mouse.moved = true; };

  // ---------------------------------------------------------------- boot
  AD.boot = function (start) {
    const cv = document.getElementById('screen');
    cv.width = W; cv.height = H;
    AD.canvas = cv;
    AD.ctx = cv.getContext('2d');
    AD.ctx.imageSmoothingEnabled = false;
    window.addEventListener('keydown', (e) => onKey(e, true));
    window.addEventListener('keyup', (e) => onKey(e, false));
    window.addEventListener('blur', () => { BTN.forEach((b) => { inp.src.key[b] = false; }); });
    bindPointer(cv);
    bindTouchPad();
    const fit = () => {
      const wrap = document.getElementById('stage');
      if (!wrap) return;
      const r = wrap.getBoundingClientRect();
      const s = Math.max(1, Math.min(r.width / W, r.height / H));
      // integer scale when there is room, so pixels stay square and even
      const k = s >= 2 ? Math.floor(s) : s;
      cv.style.width = Math.floor(W * k) + 'px';
      cv.style.height = Math.floor(H * k) + 'px';
    };
    window.addEventListener('resize', fit);
    new ResizeObserver(fit).observe(document.getElementById('stage'));
    fit();
    start();
    requestAnimationFrame(loop);
  };
})(window.AD);

// ---- js/gfx.js
// Graphics: bitmap font, windows, icons, colour helpers, and the diorama post-effects
// (light pools, bloom, tilt-shift blur, vignette, weather).
(function (AD) {
  'use strict';
  const W = AD.W, H = AD.H;
  const G = (AD.gfx = {});

  // ---------------------------------------------------------------- palette
  G.C = {
    ink: '#0b0e1c', night: '#141a36', navy: '#1d2550', indigo: '#2b3473', slate: '#4a5390',
    gold: '#e8c170', goldD: '#a2783a', rose: '#e8607e', roseD: '#8e2f4a', cream: '#f6ecd4',
    gray: '#9aa1c4', dim: '#626a96', blue: '#5b9cf5', red: '#ef5858', green: '#58c97a',
    hp: '#7be88f', hpLow: '#ef5858', teal: '#5fd4c8', violet: '#a98cf0', white: '#ffffff',
  };

  G.rgb = function (hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  G.hex = (r, g, b) => '#' + [r, g, b].map((v) => AD.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  // amt > 0 lightens toward white, < 0 darkens toward black
  G.shade = function (hex, amt) {
    const [r, g, b] = G.rgb(hex);
    if (amt >= 0) return G.hex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    return G.hex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
  };
  G.mix = function (a, b, t) {
    const A = G.rgb(a), B = G.rgb(b);
    return G.hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  };
  G.canvas = function (w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    c.x = x;
    return c;
  };

  // ---------------------------------------------------------------- font
  // 5x9 cells: rows 0-6 sit on the baseline, rows 7-8 are descenders. Widths trim automatically.
  const F = {
    A: ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    B: ['####.', '#...#', '#...#', '####.', '#...#', '#...#', '####.'],
    C: ['.###.', '#...#', '#....', '#....', '#....', '#...#', '.###.'],
    D: ['####.', '#...#', '#...#', '#...#', '#...#', '#...#', '####.'],
    E: ['#####', '#....', '#....', '####.', '#....', '#....', '#####'],
    F: ['#####', '#....', '#....', '####.', '#....', '#....', '#....'],
    G: ['.###.', '#...#', '#....', '#.###', '#...#', '#...#', '.####'],
    H: ['#...#', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
    I: ['###', '.#.', '.#.', '.#.', '.#.', '.#.', '###'],
    J: ['..###', '...#.', '...#.', '...#.', '#..#.', '#..#.', '.##..'],
    K: ['#...#', '#..#.', '#.#..', '##...', '#.#..', '#..#.', '#...#'],
    L: ['#....', '#....', '#....', '#....', '#....', '#....', '#####'],
    M: ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#'],
    N: ['#...#', '##..#', '#.#.#', '#..##', '#...#', '#...#', '#...#'],
    O: ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],

    if (has('shako')) { const c = L.hat || main; r.rect(5, Math.max(0, hy - 2), 6, 3, c); r.row(hy + 1, 4, 11, G.shade(c, -0.3)); r.set(7, Math.max(0, hy - 1), acc); }
    if (has('cap')) { const c = L.hat || main; r.row(hy, 5, 10, c); r.row(hy + 1, 4, 11, c); if (view === 'front') r.row(hy + 2, 4, 11, G.shade(c, -0.35)); }
    if (has('hood')) {
      const c = L.hood || main;
      r.row(hy, hx0 + 1, hx1 - 1, c); r.rect(hx0, hy + 1, 8, 2, c);
      if (view === 'back') r.rect(hx0, hy + 1, 8, 6, c);
      else { r.col(hx0, hy + 3, hy + 6, c); r.col(hx1, hy + 3, hy + 6, c); r.row(ty0, b.sh[0], b.sh[1], c); }
    }
    if (has('veil')) {
      const c = L.hood || '#8a8a96';
      r.row(hy, hx0 + 1, hx1 - 1, c); r.rect(hx0, hy + 1, 8, 3, c);
      r.col(hx0, hy + 3, ty0 + 1, c); r.col(hx1, hy + 3, ty0 + 1, c);
      if (view === 'back') r.rect(hx0, hy, 8, 8, c);
      else if (view === 'front') { r.row(hy + 6, hx0 + 1, hx1 - 1, c); r.row(hy + 5, hx0 + 1, hx1 - 1, c); r.set(6, hy + 4, '#f4f4ff'); r.set(9, hy + 4, '#f4f4ff'); }
    }
    if (has('helmet')) {
      const c = L.helm || '#d8dce8';
      r.row(hy, hx0 + 1, hx1 - 1, c); r.rect(hx0, hy + 1, 8, 3, c);
      if (view === 'front') { r.row(hy + 3, 5, 10, G.shade(c, -0.5)); r.col(hx0, hy + 4, hy + 5, c); r.col(hx1, hy + 4, hy + 5, c); }
      if (view === 'back') r.rect(hx0, hy, 8, 6, c);
      if (L.plume) { r.set(7, Math.max(0, hy - 1), L.plume); r.set(8, Math.max(0, hy - 1), L.plume); r.set(9, Math.max(0, hy - 2), L.plume); }
    }
    if (has('mask') && view !== 'back') { const c = L.maskC || '#c9a35d'; r.rect(5, hy + 3, 6, 3, c); r.set(6, hy + 4, '#120c1a'); r.set(9, hy + 4, '#120c1a'); }
    if (has('bonemask') && view !== 'back') { const c = '#e8e2d0'; r.rect(5, hy + 2, 6, 5, c); r.set(6, hy + 4, '#120c1a'); r.set(9, hy + 4, '#120c1a'); r.col(10, hy + 2, hy + 4, '#a8a290'); }
    if (has('crown')) { r.row(hy, 5, 10, G.C.gold); r.set(5, Math.max(0, hy - 1), G.C.gold); r.set(7, Math.max(0, hy - 1), G.C.gold); r.set(8, Math.max(0, hy - 1), G.C.gold); r.set(10, Math.max(0, hy - 1), G.C.gold); }
    if (has('spectacles') && view === 'front') { r.row(hy + 4, 5, 10, '#6a4a1a'); r.set(6, hy + 4, '#c98a2a'); r.set(9, hy + 4, '#c98a2a'); }
    if (has('gear') && view !== 'back') { r.set(7, ty0, '#c98a2a'); r.set(8, ty0, '#e8b84a'); }
    if (has('scar') && view === 'front') r.row(hy + 6, 5, 10, '#d8b8a8');
    if (has('patch') && view === 'front') { r.row(hy + 3, 4, 11, '#2a2030'); r.set(9, hy + 4, '#2a2030'); r.set(9, hy + 5, '#2a2030'); }
    if (has('bells')) { r.set(6, hy + 7, G.C.gold); r.set(9, hy + 8 > 15 ? 15 : hy + 8, G.C.gold); }

    // held item, viewer's right
    const hx = b.arm[1] + (b.fist ? 2 : 1), hyy = ty1;
    switch (view === 'back' ? null : L.held) {
      case 'knife': r.set(hx, hyy - 1, '#dfe6f2'); r.set(hx, hyy, '#9aa1c4'); break;
      case 'knives': r.set(hx, hyy - 1, '#dfe6f2'); r.set(b.arm[0] - 1, hyy - 1, '#dfe6f2'); break;
      case 'sword': r.col(hx, hyy - 6, hyy - 1, '#e6ecff'); r.set(hx, hyy, L.hilt || G.C.gold); r.set(hx - 1, hyy - 1, L.hilt || G.C.gold); break;
      case 'prism': r.col(hx, hyy - 6, hyy - 1, '#bff0ff'); r.set(hx, hyy - 4, '#ffb0e0'); r.set(hx, hyy - 2, '#fff0a0'); r.set(hx, hyy, '#e8607e'); break;
      case 'lance': r.col(hx, Math.max(0, hy - 1), hyy + 2, '#8a6a4a'); r.set(hx, Math.max(0, hy - 2), '#e6ecff'); r.set(hx, Math.max(0, hy - 1), '#e6ecff'); break;
      case 'staff': r.col(hx, hy + 1, hyy + 2, L.staffC || '#d8d8e0'); r.col(hx, hy + 1, hy + 4, '#2a2a3a'); r.set(hx, hy, G.C.gold); break;
      case 'rifle': r.line(hx - 1, hyy + 1, hx + 1, hyy - 5, '#5a4a3a'); r.set(hx + 1, hyy - 6, '#9aa1c4'); break;
      case 'crossbow': r.row(hyy - 1, hx - 1, hx + 1, '#6a4a2a'); r.set(hx, hyy - 2, '#9aa1c4'); break;
      case 'book': r.rect(hx, hyy - 2, 2, 3, L.bookC || '#8e2f4a'); r.set(hx, hyy - 2, G.C.gold); break;
      case 'brush': r.col(hx, hyy - 4, hyy, '#c9a35d'); r.set(hx, hyy - 5, '#e8607e'); break;
      case 'skillet': r.rect(hx, hyy - 2, 2, 2, '#3a3a44'); r.set(hx + 1, hyy, '#5a4a3a'); break;
      case 'poker': r.col(hx, hyy - 5, hyy, '#5a5a66'); r.set(hx + 1, hyy - 5, '#5a5a66'); break;
      case 'flame': r.set(hx, hyy - 1, '#ffb347'); r.set(hx, hyy - 2, '#ff6a3a'); r.set(hx, hyy, '#fff2a8'); break;
      case 'orb': r.set(hx, hyy - 1, L.orbC || '#bfe0ff'); r.set(hx, hyy - 2, '#ffffff'); break;
    }
  }

  function chibiFrame(L, pose) {
    const r = new Ras(16, 16);
    if (L.mount) drawMounted(r, L, pose); else drawChibi(r, L, pose);
    r.shade(0.16, { [L.eyes || '#20182c']: 1 });
    r.outline(L.outline || OUT);
    return r;
  }

  // a rider on a horse, both inside 16x16
  function drawMounted(r, L, pose) {
    const horse = L.mount, hd = G.shade(horse, -0.25), bob = pose.bob || 0;
    const legLift = pose.legs === 'L' ? 1 : 0, legLift2 = pose.legs === 'R' ? 1 : 0;
    const flip = pose.view === 'side';
    // horse body
    r.rect(3, 9, 9, 3, horse);
    r.col(3, 12, 14 - legLift, hd); r.col(5, 12, 14 - legLift2, hd); r.col(9, 12, 14 - legLift, hd); r.col(11, 12, 14 - legLift2, hd);
    r.rect(11, 6, 2, 4, horse); r.rect(12, 5, 2, 2, horse); r.set(13, 7, horse);
    r.col(10, 6, 8, L.hair && L.mane ? L.mane : G.shade(horse, -0.4));
    if (L.barding) r.row(10, 4, 10, L.barding);
    // rider
    const main = L.main, skin = L.skin;
    r.rect(5, 5 + bob, 4, 4, main);
    r.set(4, 6 + bob, main); r.set(9, 6 + bob, main);
    r.row(4 + bob, 5, 8, main);
    r.rect(5, 0 + bob, 4, 4, skin);
    r.row(0 + bob, 5, 8, L.hair || main);
    r.set(5, 1 + bob, L.hair || main); r.set(8, 1 + bob, L.hair || main);
    if (pose.view !== 'back') { r.set(6, 2 + bob, L.eyes || '#20182c'); r.set(8, 2 + bob, L.eyes || '#20182c'); }
    if ((L.extras || []).indexOf('helmet') >= 0) { r.row(0 + bob, 5, 8, L.helm || '#e8ecf4'); r.row(1 + bob, 5, 8, L.helm || '#e8ecf4'); r.set(4, 1 + bob, L.helm || '#e8ecf4'); r.set(9, 1 + bob, L.helm || '#e8ecf4'); }
    if ((L.extras || []).indexOf('lantern') >= 0 && pose.view !== 'back') r.set(6, 6 + bob, '#fff2a8'), r.set(7, 6 + bob, '#ffffff');
    if (L.held === 'lance') { r.col(10, 0, 9 + bob, '#8a6a4a'); r.set(10, 0, '#e6ecff'); }
    else if (L.held === 'sword') r.col(10, 3 + bob, 7 + bob, '#e6ecff');
    void flip;
  }

  // ---------------------------------------------------------------- big bodies (32x32)
  const BIG = {
    giant(r, L, t) { // a humanoid at twice the scale
      const s = new Ras(16, 16);
      drawChibi(s, L, { view: 'front', legs: t % 2 ? 'L' : 'stand', bob: t % 2 });
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const c = s.get(x, y); if (c) r.rect(x * 2, y * 2, 2, 2, c); }
    },
    concordance(r, L, t) { // patchwork, seams of silver, too many hands
      const bob = t % 2;
      r.ellipse(16, 9 + bob, 7, 7, '#5a4a5a');
      r.ellipse(16, 20 + bob, 11, 9, '#4a3a4a');
      r.rect(6, 22, 5, 9, '#3a2c3a'); r.rect(21, 22, 5, 9, '#3a2c3a');
      r.rect(2, 13 + bob, 5, 11, '#5a3a4a'); r.rect(25, 13 + bob, 5, 11, '#5a3a4a');
      for (let i = 0; i < 9; i++) r.line(8 + i * 2, 12 + (i % 3) * 3, 10 + i * 2, 26, '#cfd8e8');
      r.rect(12, 7 + bob, 8, 2, '#ffe28a'); r.set(13, 7 + bob, '#ffffff'); r.set(18, 7 + bob, '#ffffff');
      r.set(3, 24 + bob, '#d8b8a0'); r.set(28, 24 + bob, '#d8b8a0'); r.set(2, 24 + bob, '#d8b8a0'); r.set(29, 24 + bob, '#d8b8a0');
    },
    tide(r, L, t) { // a drowned moon of a face, seen through deep water
      const w = Math.sin(t / 2) * 1;
      r.ellipse(16, 15, 13, 13, '#1a3a5a');
      r.ellipse(16, 15, 11, 11, '#4a7a9a');
      r.ellipse(16 + w, 14, 8, 9, '#b8d0e0');
      r.rect(11 + w, 12, 3, 1, '#1a3a5a'); r.rect(18 + w, 12, 3, 1, '#1a3a5a');
      r.rect(13 + w, 19, 6, 1, '#6a8aa0');
      for (let i = 0; i < 6; i++) r.set(5 + i * 4, 28 - (i % 2), '#7ab0d8');
    },
    nul(r, L, t) { // a hole in the shape of a man
      r.ellipse(16, 7, 4, 5, '#000000');
      r.rect(12, 11, 9, 13, '#000000'); r.rect(10, 12, 2, 9, '#000000'); r.rect(21, 12, 2, 9, '#000000');
      r.rect(13, 24, 3, 7, '#000000'); r.rect(17, 24, 3, 7, '#000000');
      for (let i = 0; i < 7; i++) r.set(12 + ((i * 7 + t) % 9), 12 + ((i * 5) % 12), '#2a2a44');
    },
    tessellate(r, L, t) { // too many sides
      const k = t % 4;
      const pts = [];
      for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2 + k * 0.4; pts.push([16 + Math.cos(a) * 12, 16 + Math.sin(a) * 12]); }
      r.poly(pts, '#7a6ab8');
      const pts2 = pts.map((p, i) => [16 + (p[0] - 16) * (i % 2 ? 0.45 : 0.75), 16 + (p[1] - 16) * (i % 2 ? 0.45 : 0.75)]);
      r.poly(pts2, '#c8b8ff');
      r.line(4, 16, 28, 16, '#ffffff'); r.line(16, 4, 16, 28, '#e8e0ff');
    },
    haar(r, L, t) { // grey fog that unmakes
      for (let i = 0; i < 6; i++) r.ellipse(8 + i * 3.5, 16 + Math.sin(t / 2 + i) * 3, 6, 5, i % 2 ? '#9aa0a8' : '#b8bec6');
      r.set(13, 14, '#606870'); r.set(19, 14, '#606870');
    },
    sleeper(r, L, t) { // the thing that runs
      const bob = t % 2;
      r.ellipse(16, 18 + bob, 13, 8, '#2a3a4a');
      r.ellipse(26, 12 + bob, 5, 5, '#2a3a4a');
      r.rect(5, 23, 3, 8 - bob, '#1a2a3a'); r.rect(12, 23, 3, 7 + bob, '#1a2a3a'); r.rect(19, 23, 3, 8 - bob, '#1a2a3a'); r.rect(25, 22, 3, 8 + bob, '#1a2a3a');
      r.set(28, 11 + bob, '#ff5040'); r.set(25, 11 + bob, '#ff5040');
      for (let i = 0; i < 6; i++) r.set(8 + i * 3, 11 + (i % 2) + bob, '#4a6a8a');
    },
    sun(r, L, t) { // the Queen's sunlight given a body
      r.ellipse(16, 16, 12 + (t % 2), 12 + (t % 2), '#ffcf5a');
      r.ellipse(16, 16, 8, 8, '#fff2b0');
    },
  };

  // ---------------------------------------------------------------- cache API
  const cache = {};
  // returns { idle:[c,c], down:[c,c], up:[c,c], right:[c,c], left:[c,c], big }
  S.unit = function (L) {
    const key = L.key || JSON.stringify(L);
    if (cache[key]) return cache[key];
    let out;
    if (L.big) {
      const fr = [0, 1, 2, 3].map((t) => {
        const r = new Ras(32, 32);
        BIG[L.big](r, L, t);
        r.shade(0.14);
        r.outline(OUT);
        return r.canvas();
      });
      out = { big: true, idle: fr, down: fr, up: fr, right: fr, left: fr };
    } else {
      const f = (view, legs, bob) => chibiFrame(L, { view, legs, bob });
      const side = [f('side', 'L', 0), f('side', 'R', 0)];
      out = {
        idle: [f('front', 'stand', 0).canvas(), f('front', 'stand', 1).canvas()],
        down: [f('front', 'L', 0).canvas(), f('front', 'R', 0).canvas()],
        up: [f('back', 'L', 0).canvas(), f('back', 'R', 0).canvas()],
        right: side.map((r) => r.canvas()),
        left: side.map((r) => r.flip().canvas()),
      };
    }
    cache[key] = out;
    return out;
  };
  // draw a unit sprite with its feet at (x+8, y+15)
  S.drawUnit = function (ctx, L, x, y, opt) {
    opt = opt || {};
    const s = S.unit(L);
    const dir = opt.dir || 'idle';
    let fr;
    if (dir === 'idle') {
      const ph = Math.floor((AD.frame + (opt.phase || 0)) / 22) % 4;
      fr = s.idle[ph === 1 || ph === 2 ? 1 : 0];
      if (s.big) fr = s.idle[Math.floor((AD.frame + (opt.phase || 0)) / 16) % 4];
    } else {
      fr = s[dir][Math.floor(AD.frame / 8) % (s[dir].length)];
    }
    if (opt.gray) {
      ctx.save(); ctx.filter = 'grayscale(1) brightness(0.75)';
    }
    if (s.big) ctx.drawImage(fr, Math.round(x) - 8, Math.round(y) - 16);
    else ctx.drawImage(fr, Math.round(x), Math.round(y));
    if (opt.gray) ctx.restore();
  };

  // ---------------------------------------------------------------- portraits
  // P: { skin, hair, hairStyle, eyes, eyeShape, brows, main, sec, acc, collar, extras, fem, age }
  const pcache = {};
  S.portrait = function (P, expr) {
    expr = expr || 'neutral';
    const key = (P.key || JSON.stringify(P)) + '|' + expr;
    if (pcache[key]) return pcache[key];
    const r = new Ras(48, 48);
    paintPortrait(r, P, expr);
    const c = r.canvas();
    pcache[key] = c;
    return c;
  };

  function paintPortrait(r, P, expr) {
    const skin = P.skin, sd = G.shade(skin, -0.16), sh = G.shade(skin, 0.12);
    const hair = P.hair || '#2a2030', hd = G.shade(hair, -0.3), hl = G.shade(hair, 0.3);
    const main = P.main || '#4a5390', md = G.shade(main, -0.3);
    const sec = P.sec || G.shade(main, 0.4), acc = P.acc || G.C.gold;
    const ex = P.extras || [];
    const has = (k) => ex.indexOf(k) >= 0;
    const st = P.hairStyle || 'short';
    const fem = !!P.fem;
    const wide = P.wide || 0; // broader face/neck (big builds)

    // back hair
    const backHair = {
      long: () => { r.poly([[9, 14], [39, 14], [43, 48], [5, 48]], hd); r.ellipse(24, 20, 16, 15, hd); },
      platinum: () => { r.poly([[8, 14], [40, 14], [44, 48], [4, 48]], hd); r.ellipse(24, 20, 16, 15, hd); },
      wavy: () => { r.ellipse(24, 22, 19, 18, hd); r.ellipse(10, 36, 8, 10, hd); r.ellipse(38, 36, 8, 10, hd); r.ellipse(8, 26, 6, 9, hd); r.ellipse(40, 26, 6, 9, hd); },
      bob: () => { r.poly([[9, 14], [39, 14], [40, 34], [8, 34]], hd); },
      soft: () => { r.poly([[10, 14], [38, 14], [38, 32], [10, 32]], hd); },
      braids: () => { r.ellipse(24, 20, 16, 15, hd); for (let i = 0; i < 6; i++) r.rect(8 + i * 6, 26, 3, 20, i % 2 ? hd : G.shade(hair, -0.4)); },
      white: () => { r.poly([[9, 14], [39, 14], [41, 44], [7, 44]], hd); r.ellipse(24, 20, 16, 15, hd); },
      wild: () => { r.ellipse(24, 19, 18, 17, hd); },
      storm: () => { r.ellipse(24, 14, 18, 15, hd); for (let i = 0; i < 7; i++) r.line(10 + i * 4, 10, 8 + i * 5, 0, hd); },
      ponytail: () => { r.ellipse(36, 28, 5, 12, hd); },
    };
    if (backHair[st]) backHair[st]();
    if (has('braidback') || st === 'shavedbraid') { r.rect(35, 22, 4, 26, hair); for (let y = 24; y < 48; y += 4) r.row(y, 35, 38, hd); r.set(36, 30, '#d8d8e8'); r.set(37, 38, '#d8d8e8'); r.set(36, 46, '#d8d8e8'); }

    // shoulders and clothes
    const collar = P.collar || 'shirt';
    r.poly([[4 - wide, 48], [8 - wide, 39], [17, 35], [31, 35], [40 + wide, 39], [44 + wide, 48]], main);
    r.poly([[4 - wide, 48], [8 - wide, 39], [12, 37], [10, 48]], md);
    // neck
    r.rect(19 - Math.floor(wide / 2), 29, 10 + wide, 8, sd);
    switch (collar) {
      case 'shirt': r.poly([[18, 35], [24, 41], [30, 35], [28, 34], [24, 38], [20, 34]], sec); break;
      case 'vneck': r.poly([[19, 35], [24, 42], [29, 35]], sd); break;
      case 'coat':
        r.poly([[16, 35], [24, 46], [20, 48], [12, 37]], sec);
        r.poly([[32, 35], [24, 46], [28, 48], [36, 37]], sec);
        r.poly([[19, 35], [24, 44], [29, 35]], P.shirt || '#e8e0d0');
        break;
      case 'high': r.rect(17, 31, 14, 6, main); r.row(31, 17, 30, sec); break;
      case 'gown': r.poly([[14, 38], [24, 44], [34, 38], [34, 40], [24, 48], [14, 40]], skin); r.rect(19, 29, 10, 9, sd); r.row(39, 14, 34, acc); break;
      case 'armor':
        r.poly([[4, 48], [6, 38], [16, 34], [32, 34], [42, 38], [44, 48]], main);
        r.ellipse(9, 40, 6, 4, sec); r.ellipse(39, 40, 6, 4, sec);
        r.row(36, 16, 32, sec); r.rect(17, 31, 14, 5, md);
        break;
      case 'apron': r.poly([[18, 35], [24, 41], [30, 35]], sec); r.rect(15, 40, 3, 8, '#f4ecd8'); r.rect(30, 40, 3, 8, '#f4ecd8'); break;
      case 'robe': r.poly([[17, 35], [24, 48], [31, 35]], sec); r.rect(17, 31, 14, 5, main); break;
      case 'wraps': r.row(40, 8, 40, sec); r.row(43, 6, 42, sec); break;
      case 'tank': r.poly([[8, 48], [10, 40], [17, 35], [31, 35], [38, 40], [40, 48]], skin); r.poly([[14, 48], [16, 38], [32, 38], [34, 48]], main); break;
      case 'patch': for (let i = 0; i < 6; i++) r.rect(6 + i * 6, 39 + (i % 2) * 3, 6, 9, ['#8a5a3a', '#4a6a8a', '#8a3a4a', '#5a7a4a', '#9a8a4a', '#6a4a7a'][i]); break;
      case 'veil': r.poly([[6, 48], [10, 26], [24, 8], [38, 26], [42, 48]], P.veil || '#7a7a88'); break;
    }
    if (has('scarf')) { r.poly([[15, 33], [33, 33], [34, 38], [14, 38]], P.scarf || acc); r.rect(29, 37, 4, 9, P.scarf || acc); }
    if (has('lantern')) { r.rect(21, 40, 6, 7, '#c9a35d'); r.rect(22, 41, 4, 5, '#fff2a8'); r.set(23, 42, '#ffffff'); }
    if (has('gear')) { r.ellipse(24, 33, 3, 3, '#c98a2a'); r.set(24, 33, '#5a3a1a'); r.set(21, 33, '#e8b84a'); r.set(27, 33, '#e8b84a'); }
    if (has('throatscar')) r.row(32, 19, 28, '#e8d0c0');

    // face
    const fw = (P.faceW || 10.5) + wide * 0.5;
    r.ellipse(24, 21, fw, 12.5, skin);
    // jaw
    const jaw = P.jaw === 'square' ? [[14, 24], [34, 24], [32, 32], [28, 34], [20, 34], [16, 32]] : [[15, 24], [33, 24], [30, 31], [26, 34], [22, 34], [18, 31]];
    r.poly(jaw.map(([x, y]) => [x + (x < 24 ? -wide * 0.4 : wide * 0.4), y]), skin);
    // ears

  TL.bake = function (map, state) {
    const b = BI[map.biome] || BI.city;
    const night = !!map.night;
    const W = map.w * 16, Hh = map.h * 16;
    const grounds = [0, 1].map((fr) => {
      const cv = G.canvas(W, Hh);
      for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) ground(cv.x, map.at(x, y), x, y, x * 16, y * 16, b, fr, map);
      // soft shadow under props to anchor them
      for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
        const t = T[map.at(x, y)];
        if (t && t.prop && '#BnKDQ'.indexOf(map.at(x, y)) < 0) {
          cv.x.fillStyle = 'rgba(10,8,20,0.22)';
          cv.x.beginPath(); cv.x.ellipse(x * 16 + 8, y * 16 + 14, 7, 2.5, 0, 0, Math.PI * 2); cv.x.fill();
        }
      }
      return cv;
    });
    const rows = [];
    for (let y = 0; y < map.h; y++) rows.push(TL.bakeRow(map, y, state));
    const lights = [];
    for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
      const ch = map.at(x, y), t = T[ch];
      if (!t || !t.light) continue;
      if ((ch === 'H' || ch === 'S' || ch === 'n') && !night) continue;
      const big = ch === 'Q' ? 80 : ch === 'K' ? 40 : ch === 'L' ? 34 : ch === 'n' ? 30 : ch === 'i' ? 14 : 26;
      lights.push({ x: x * 16 + 8, y: y * 16 + (ch === 'L' ? -2 : ch === 'Q' ? -24 : 8), r: big, c: t.light, a: ch === 'i' ? 0.18 : 0.32 });
    }
    return { grounds, rows, lights, biome: b };
  };
  TL.bakeRow = function (map, y, state) {
    const b = BI[map.biome] || BI.city;
    const cv = G.canvas(map.w * 16, 64);
    let any = false;
    for (let x = 0; x < map.w; x++) {
      const ch = map.at(x, y), t = T[ch];
      if (t && t.prop) { prop(cv.x, ch, x, y, x * 16, 48, b, map, state, map.night); any = true; }
    }
    return any ? cv : null;

      case '@flash': AD.fx.flash(L[1] || '#ffffff', L[2] || 20); return;

      if (hit && S.w.drain) { const heal = Math.floor(dmg / 2); att.hp = Math.min(att.mhp, att.hp + heal); ev.healed = heal; }
      ev.aHp = a.hp; ev.dHp = d.hp;
      tl.push(ev);
      if (def.hp <= 0) break;
    }
    // weapon break
    [['a', a, fc.A], ['d', d, fc.D]].forEach(([w, u, S]) => {
      if (!S || !S.wo || u.team !== 'p') return;
      const it = u.items[S.wo.i];
      if (it && it.uses <= 0 && AD.ITEMS[it.id].uses < 99) { tl.push({ broke_weapon: AD.ITEMS[it.id].n, who: w }); u.items.splice(S.wo.i, 1); const e = equipped(u); u.eq = e ? e.i : 0; }
      if (used[w] && u.wexp) u.wexp[S.w.t] = (u.wexp[S.w.t] || 0) + (S.w.t === 'all' ? 0 : 1 + (u === a ? 1 : 0));
    });
    return { tl, dealt };
  };

  // ---------------------------------------------------------------- camera and helpers
  B.snapCam = function () {
    this.cam.tx = AD.clamp(this.cursor.x * TS + 8 - W / 2, 0, Math.max(0, this.map.w * TS - W));
    this.cam.ty = AD.clamp(this.cursor.y * TS + 8 - H / 2, 0, Math.max(0, this.map.h * TS - H));
    this.cam.x = this.cam.tx; this.cam.y = this.cam.ty;
  };
  B.follow = function (x, y, margin) {
    margin = margin === undefined ? 40 : margin;
    const px = x * TS + 8, py = y * TS + 8;
    const mw = this.map.w * TS, mh = this.map.h * TS;
    if (px - this.cam.tx < margin) this.cam.tx = px - margin;
    if (px - this.cam.tx > W - margin) this.cam.tx = px - W + margin;
    if (py - this.cam.ty < margin) this.cam.ty = py - margin;
    if (py - this.cam.ty > H - margin) this.cam.ty = py - H + margin;
    this.cam.tx = AD.clamp(this.cam.tx, 0, Math.max(0, mw - W));
    this.cam.ty = AD.clamp(this.cam.ty, 0, Math.max(0, mh - H));
    if (mw < W) this.cam.tx = (mw - W) / 2;
    if (mh < H) this.cam.ty = (mh - H) / 2;
  };
  B.centerOn = async function (x, y) {
    this.follow(x, y, 100);
    for (let i = 0; i < 40 && (Math.abs(this.cam.x - this.cam.tx) > 1 || Math.abs(this.cam.y - this.cam.ty) > 1); i++) await AD.wait(1);
  };
  B.async = function (fn) {
    this.busy = true;
    return Promise.resolve().then(fn).catch((e) => { console.error(e); }).then(() => { this.busy = false; });
  };
  B.say = function (lines) { return AD.dialogue(lines, { overMap: true }); };

  // walk a unit along a path
  B.walk = function (u, path) {
    if (AD.TEST) { const e = path && path[path.length - 1]; if (e) { u.x = e.x; u.y = e.y; } return Promise.resolve(); }
    return new Promise((res) => {
      if (!path || path.length <= 1) { if (path && path[0] && path[0].warp) { u.x = path[0].x; u.y = path[0].y; AD.audio.sfx('warp'); } res(); return; }
      u.walk = { path, i: 0, t: 0, res };
    });
  };
  B.updateWalks = function () {
    this.units.forEach((u) => {
      const w = u.walk;
      if (!w) return;
      w.t += I.held.fast ? 3 : 1;
      const spd = 4;
      while (w.t >= spd && w.walk !== false) {
        w.t -= spd; w.i++;
        if (w.i % 2 === 0) AD.audio.sfx('step');
        if (w.i >= w.path.length - 1) {
          const end = w.path[w.path.length - 1];
          u.x = end.x; u.y = end.y; u.walk = null; w.res();
          break;
        }
      }
      if (u.walk) {
        const a = w.path[w.i], b = w.path[w.i + 1];
        u.dx = b.x - a.x; u.dy = b.y - a.y;
        u.wx = (a.x + (b.x - a.x) * (w.t / spd)) * TS; u.wy = (a.y + (b.y - a.y) * (w.t / spd)) * TS;
        this.follow(u.wx / TS, u.wy / TS, 48);
      }
    });
  };

  // ---------------------------------------------------------------- scene lifecycle
  B.enter = function () {
    AD.curBattle = this;
    AD.audio.play(this.ch.music && this.ch.music.p || 'player');
    if (!this.started) {
      this.started = true;
      this.async(async () => {
        await AD.wait(10);
        if (this.ch.intro && this.ch.intro.length) await this.say(this.ch.intro);
        await this.trigger({ start: true });
        await this.beginPhase('p');
      });
    }
  };

  B.update = function () {
    this.updateWalks();
    this.cam.x += (this.cam.tx - this.cam.x) * 0.25;
    this.cam.y += (this.cam.ty - this.cam.y) * 0.25;
    if (this.banner) { this.banner.t++; if (this.banner.t > this.banner.life) { const r = this.banner.res; this.banner = null; r && r(); } }
    this.anim = this.anim.filter((a) => { a.t++; return a.t < a.life; });
    if (this.busy || this.over) return;
    if (this.phase !== 'p') return;
    // nothing is running but the state says something should be: recover rather than freeze
    if (this.state === 'walking' || this.state === 'action' || this.state === 'busy') {
      if (this.sel && !this.sel.done && this.state !== 'busy') { this.async(() => this.actionMenu(this.sel)); return; }
      this.state = 'map'; this.sel = null; this.moves = null;
    }
    this.playerInput();
  };

  // ---------------------------------------------------------------- player input
  B.cursorInput = function (allowed) {
    const d = I.dir();
    let moved = false;
    if (d) {
      const nx = AD.clamp(this.cursor.x + d[0], 0, this.map.w - 1), ny = AD.clamp(this.cursor.y + d[1], 0, this.map.h - 1);
      if (nx !== this.cursor.x || ny !== this.cursor.y) { this.cursor.x = nx; this.cursor.y = ny; moved = true; }
    }
    const m = I.mouse;
    if (m.moved && m.over) {
      const tx = Math.floor((m.x + this.cam.x) / TS), ty = Math.floor((m.y + this.cam.y) / TS);
      if (tx >= 0 && ty >= 0 && tx < this.map.w && ty < this.map.h && (tx !== this.cursor.x || ty !== this.cursor.y)) { this.cursor.x = tx; this.cursor.y = ty; moved = true; }
    }
    if (moved) { AD.audio.sfx('cursor'); this.follow(this.cursor.x, this.cursor.y, I.lastDevice === 'mouse' ? 8 : 40); }
    // edge-scroll with the mouse near the frame
    if (m.over && I.lastDevice === 'mouse' && AD.frame - m.lastMove < 300) {
      if (m.x < 6) this.cam.tx = Math.max(0, this.cam.tx - 2);
      if (m.x > W - 6) this.cam.tx = Math.min(Math.max(0, this.map.w * TS - W), this.cam.tx + 2);
      if (m.y < 6) this.cam.ty = Math.max(0, this.cam.ty - 2);
      if (m.y > H - 6) this.cam.ty = Math.min(Math.max(0, this.map.h * TS - H), this.cam.ty + 2);
    }
    return moved;
  };
  // a click picks the tile under the pointer; returns true when the confirm action should fire
  B.clickTile = function () {
    const c = I.consumeClick();
    if (!c) return false;
    const tx = Math.floor((c.x + this.cam.x) / TS), ty = Math.floor((c.y + this.cam.y) / TS);
    if (tx < 0 || ty < 0 || tx >= this.map.w || ty >= this.map.h) return false;
    const same = tx === this.cursor.x && ty === this.cursor.y;
    this.cursor.x = tx; this.cursor.y = ty;
    return same || I.lastDevice !== 'touch' || true;
  };

  B.playerInput = function () {
    if (this.state === 'map') {
      this.cursorInput();
      const go = I.pressed('a') || this.clickTile();
      const u = this.unitAt(this.cursor.x, this.cursor.y);
      if (I.pressed('x') && u && this.visible(u.x, u.y)) { this.async(() => AD.status(this.alive().filter((o) => o.team === u.team && this.visible(o.x, o.y)), this.alive().filter((o) => o.team === u.team && this.visible(o.x, o.y)).indexOf(u))); return; }
      if (I.pressed('y')) { this.danger = !this.danger; this.dz = null; AD.audio.sfx('select'); }
      if (I.pressed('l') || I.pressed('r')) {
        const ready = this.alive('p').filter((o) => !o.done);
        if (ready.length) {
          const idx = ready.findIndex((o) => o.x === this.cursor.x && o.y === this.cursor.y);
          const nx = ready[(idx + (I.pressed('l') ? -1 : 1) + ready.length) % ready.length];
          this.cursor.x = nx.x; this.cursor.y = nx.y; this.follow(nx.x, nx.y, 60); AD.audio.sfx('cursor');
        }
      }
      if (I.pressed('start') || ((I.pressed('b') || I.rclick) && false)) { this.async(() => this.mapMenu()); return; }
      if (go) {
        if (u && u.team === 'p' && !u.done) { this.select(u); return; }
        if (u && u.team !== 'p' && this.visible(u.x, u.y)) {
          u.showRange = !u.showRange; AD.audio.sfx('select'); return;
        }
        this.async(() => this.mapMenu());
      }
      if ((I.pressed('b') || I.rclick) && u && u.team !== 'p') u.showRange = false;
      return;
    }
    if (this.state === 'move') {
      const u = this.sel;
      const moved = this.cursorInput();
      if (moved) this.path = this.moves.has(key(this.cursor.x, this.cursor.y)) ? this.pathTo(this.moves, this.cursor.x, this.cursor.y) : this.path;
      const go = I.pressed('a') || this.clickTile();
      if (go) {
        const k = key(this.cursor.x, this.cursor.y);
        const t = this.unitAt(this.cursor.x, this.cursor.y);
        if (this.moves.has(k)) {
          AD.audio.sfx('select');
          const path = this.pathTo(this.moves, this.cursor.x, this.cursor.y);
          this.async(async () => {
            this.state = 'walking';
            this.from = { x: u.x, y: u.y };
            await this.walk(u, path);
            await this.actionMenu(u);
          });
          return;
        }
        // clicking an enemy in reach: walk to the best tile next to it and open the forecast
        if (t && t.team === 'e' && this.atk.has(k)) {
          const spot = this.bestSpotToHit(u, t);
          if (spot) {
            AD.audio.sfx('select');
            const path = this.pathTo(this.moves, spot.x, spot.y);
            this.async(async () => {
              this.state = 'walking';
              this.from = { x: u.x, y: u.y };
              await this.walk(u, path);
              const ok = await this.attackFlow(u, t);
              if (ok) await this.finish(u);
              else await this.actionMenu(u);
            });
            return;
          }
        }
        AD.audio.sfx('cancel');
      }
      if (I.pressed('b') || I.rclick) { AD.audio.sfx('cancel'); this.state = 'map'; this.cursor.x = u.x; this.cursor.y = u.y; this.sel = null; }
      if (I.pressed('x')) { const o = this.unitAt(this.cursor.x, this.cursor.y); if (o) this.async(() => AD.status([o], 0)); }
    }
  };
  B.bestSpotToHit = function (u, t) {
    let best = null;
    this.moves.forEach((v) => {
      weapons(u).forEach((w) => {
        if (this.inRange(u, w, v.x, v.y, t.x, t.y)) {
          const sc = (this.terrain(v.x, v.y).avo || 0) - v.c * 0.1;
          if (!best || sc > best.sc) best = { x: v.x, y: v.y, sc };
        }
      });
    });
    return best;
  };

  B.select = function (u) {
    AD.audio.sfx('select');
    this.sel = u;
    this.moves = this.moveTiles(u);
    this.atk = new Set();
    this.heal = new Set();
    const ws = weapons(u), ss = songs(u);
    this.moves.forEach((v) => {
      ws.forEach((w) => {
        const [a, b] = this.weaponRange(u, w);
        for (let dy = -b; dy <= b; dy++) for (let dx = -b; dx <= b; dx++) {
          const dd = Math.abs(dx) + Math.abs(dy);
          if (dd < a || dd > b) continue;
          const k = key(v.x + dx, v.y + dy);
          if (!this.moves.has(k)) this.atk.add(k);
        }
      });
      if (!ws.length && ss.length) DIRS.forEach(([dx, dy]) => { const k = key(v.x + dx, v.y + dy); if (!this.moves.has(k)) this.heal.add(k); });
    });
    this.path = [{ x: u.x, y: u.y }];
    this.state = 'move';
  };

  B.undoMove = function (u) {
    if (this.from) { u.x = this.from.x; u.y = this.from.y; }
    this.cursor.x = u.x; this.cursor.y = u.y;
    this.select(u);
  };

  // ---------------------------------------------------------------- action menu
  B.targetsFor = function (u) {
    const ws = weapons(u);
    return this.alive().filter((o) => o.team === 'e' && this.visible(o.x, o.y) && ws.some((w) => this.inRange(u, w, u.x, u.y, o.x, o.y)));
  };
  B.songTargets = function (u, so) {
    const d = so.d;
    return this.alive().filter((o) => {
      if (!friends(o, u) || o === u && d.range !== 'area') return false;
      const dist = man(u.x, u.y, o.x, o.y);
      if (d.range === 'area') return o === u;
      if (d.range === 'fold') return o !== u && o.team === 'p' && dist <= 7 && dist > 1;
      if (d.range === 'far') return dist <= Math.max(2, Math.floor(stat(u, 'mag') / 2)) && o.hp < o.mhp;
      if (d.buff) return dist <= d.range;
      return dist <= d.range && (o.hp < o.mhp || (d.id === 'bellchime' && o.silenced));
    });
  };
  B.adjacent = function (u, f) { return DIRS.map(([dx, dy]) => this.unitAt(u.x + dx, u.y + dy)).filter((o) => o && (!f || f(o))); };

  B.actionMenu = async function (u) {
    for (;;) {
      this.state = 'action';
      const items = [];
      const tg = this.targetsFor(u);
      if (tg.length) items.push({ label: 'Attack', value: 'attack', icon: (equipped(u) || {}).d ? equipped(u).d.t : 'fist' });
      const ss = songs(u).filter((so) => this.songTargets(u, so).length);
      if (ss.length) items.push({ label: ss.some((s) => s.d.range === 'fold') && ss.length === 1 ? 'Fold' : 'Song', value: 'song', icon: 'song' });
      if (has(u, 'paint') && this.adjacent(u, (o) => o.team === 'p' && o.done && !has(o, 'paint')).length) items.push({ label: 'Paint', value: 'paint', icon: 'star' });
      if (has(u, 'steal') && this.adjacent(u, (o) => o.team === 'e' && stat(u, 'spd') > stat(o, 'spd') && this.stealable(o).length).length) items.push({ label: 'Steal', value: 'steal', icon: 'key' });
      const talks = this.talkTargets(u);
      if (talks.length) items.push({ label: 'Talk', value: 'talk', icon: 'rose' });
      const here = this.map.at(u.x, u.y);
      const hk = key(u.x, u.y);
      if (here === 'H' && !this.tstate.visited[hk] && u.team === 'p') items.push({ label: 'Visit', value: 'visit', icon: 'star' });
      if (here === 'C' && !this.tstate.opened[hk] && (has(u, 'locktouch') || u.items.some((i) => i.id === 'chestkey'))) items.push({ label: 'Chest', value: 'chest', icon: 'key' });
      const doors = DIRS.map(([dx, dy]) => [u.x + dx, u.y + dy]).filter(([x, y]) => this.map.at(x, y) === 'D' && !this.tstate.opened[key(x, y)]);
      if (doors.length && (has(u, 'locktouch') || u.items.some((i) => i.id === 'doorkey'))) items.push({ label: 'Door', value: 'door', icon: 'key' });
      if (this.goal.type === 'seize' && u.lord && u.x === this.goal.x && u.y === this.goal.y) items.push({ label: 'Seize', value: 'seize', icon: 'star', color: C.gold });
      if (this.goal.type === 'escape' && this.isExit(u.x, u.y)) items.push({ label: 'Escape', value: 'escape', icon: 'star', color: C.gold });
      if (has(u, 'build') && this.buildSpots(u).length) items.push({ label: 'Build', value: 'build', icon: 'item' });
      if (this.adjacent(u, (o) => o.team === 'p').length) items.push({ label: 'Trade', value: 'trade', icon: 'item' });
      const lord = this.lord();
      if (lord && (lord === u || man(lord.x, lord.y, u.x, u.y) === 1)) items.push({ label: 'Supply', value: 'supply', icon: 'item' });
      items.push({ label: 'Items', value: 'items', icon: 'item' });
      items.push({ label: 'Wait', value: 'wait' });
      const px = u.x * TS - this.cam.x;
      const v = await AD.menu({ items, x: px > W / 2 ? 8 : W - 74, y: 8, w: 66 });
      if (v === null) { if (u.acted) { await this.finish(u); return; } this.undoMove(u); return; }
      let done = false;
      switch (v) {
        case 'attack': done = await this.attackFlow(u); break;
        case 'song': done = await this.songFlow(u); break;
        case 'paint': done = await this.paintFlow(u); break;
        case 'steal': done = await this.stealFlow(u); break;
        case 'talk': done = await this.talkFlow(u, talks); break;
        case 'visit': done = await this.visitFlow(u); break;
        case 'chest': done = await this.chestFlow(u); break;
        case 'door': done = await this.doorFlow(u, doors); break;
        case 'seize': await this.finish(u); await this.win(); return;
        case 'escape': await this.escape(u); return;
        case 'build': done = await this.buildFlow(u); break;
        case 'trade': await this.tradeFlow(u); u.acted = true; continue;
        case 'supply': await AD.game.supply(u); continue;
        case 'items': { const r = await this.itemsFlow(u); if (r === 'used') done = true; continue; }
        case 'wait': done = true; break;
      }
      if (done) { await this.finish(u); return; }
    }
  };

  B.finish = async function (u) {
    u.done = true; u.acted = false;
    this.sel = null; this.state = 'map'; this.moves = null;
    this.vis = null; this.dz = null;
    await this.trigger({ area: true, unit: u });
    if (await this.checkEnd()) return;
    if (!this.alive('p').some((o) => !o.done) && !this.over) await this.endPlayerPhase();
  };

  // ---------------------------------------------------------------- attack flow + forecast
  B.attackFlow = function (u, forced) {
    return new Promise((res) => {
      const targets = forced ? [forced] : this.targetsFor(u);
      if (!targets.length) { res(false); return; }
      const scene = new Forecast(this, u, targets);
      scene.done = async (choice) => {
        AD.pop(scene);
        if (!choice) { res(false); return; }
        await this.fight(u, choice.t, choice.w, choice.boost);
        res(true);
      };
      AD.push(scene);
    });
  };

  B.fight = async function (a, d, wo, boost) {
    a.eq = wo.i;
    if (boost && a.team === 'p') { a.bp -= boost; a.boosted = true; AD.audio.sfx('boost'); }
    const fc = this.calc(a, d, wo, man(a.x, a.y, d.x, d.y), boost);
    const res = this.resolve(fc);
    await this.playCombat(fc, res);
    await this.afterCombat(fc, res);
    await this.trigger({ combat: true });
  };

  B.playCombat = async function (fc, res) {
    if (AD.TEST) return;
    if (AD.game.opt('anims')) {
      await AD.run(new Duel(this, fc, res));
      return;
    }
    // map-only: lunge and numbers
    for (const ev of res.tl) {
      if (ev.broke_weapon) { AD.fx.float(ev.broke_weapon + ' broke!', W / 2 + this.cam.x, 40 + this.cam.y, C.rose); continue; }
      const att = ev.who === 'a' ? fc.a : fc.d, def = ev.who === 'a' ? fc.d : fc.a;
      att.lunge = { dx: Math.sign(def.x - att.x), dy: Math.sign(def.y - att.y), t: 0 };
      for (let i = 0; i < 6; i++) { att.lunge.t = i < 3 ? i : 6 - i; await AD.wait(1); }
      att.lunge = null;
      const fx = def.x * TS + 8, fy = def.y * TS - 2;
      if (ev.hit) {
        AD.audio.sfx(ev.crit ? 'crit' : 'hit');
        def.flash = 8;
        AD.fx.float(String(ev.dmg), fx, fy, ev.crit ? C.gold : '#ffffff');
        if (ev.crit) AD.fx.shake(4, 12);
        if (ev.broke) { AD.audio.sfx('break'); AD.fx.float('BREAK!', fx, fy - 10, C.gold, { life: 70 }); }
        if (ev.getup) AD.fx.float('GET UP', fx, fy - 10, C.rose, { life: 70 });
      } else { AD.audio.sfx('miss'); AD.fx.float('MISS', fx, fy, C.gray); }
      def.dispHp = ev.who === 'a' ? ev.dHp : ev.aHp;
      await AD.wait(16);
      def.dispHp = undefined;
    }
  };

  B.afterCombat = async function (fc, res) {
    const { a, d } = fc;
    const dead = [a, d].filter((u) => u.hp <= 0);
    for (const u of dead) await this.kill(u, u === a ? d : a);
    // experience
    for (const [u, foe] of [[a, d], [d, a]]) {
      if (u.team !== 'p' || u.hp <= 0) continue;
      const dealt = u === a ? res.dealt.a : res.dealt.d;
      await this.giveExp(u, this.expFor(u, foe, foe.hp <= 0, dealt > 0));
      AD.game.bumpSupportNear(u, this.alive('p'));
    }
    // a stolen drop
    if (d.hp <= 0 && d.team === 'e' && d.drop && a.team === 'p') {
      const it = d.items[d.items.length - 1];
      if (it) { await this.giveItem(a, it); }
    }
    this.vis = null; this.dz = null;
  };

  B.expFor = function (u, foe, killed, dealt) {
    const la = u.lv + (cls(u).tier - 1) * 15, lb = foe.lv + (cls(foe).tier - 1) * 15;
    let e = dealt ? Math.max(1, Math.floor((31 + lb - la) / 3)) : 1;
    if (killed) e += Math.max(0, 20 + (lb - la) * 3 + (foe.boss ? 40 : 0));
    if (this.diff === 0) e = Math.round(e * 1.3);
    if (u.items.some((i) => i.id === 'schedule')) e = Math.round(e * 1.5);
    return AD.clamp(e, 1, 100);
  };

  B.giveExp = async function (u, n) {
    const cap = cls(u).tier >= 3 ? 30 : 20;
    if (u.lv >= cap) return;
    u.exp += n;
    if (u.exp >= 100) {
      u.exp -= 100;
      u.lv++;
      const gains = AD.game.levelUp(u);
      if (!AD.TEST) await AD.run(new LevelUp(this, u, gains));
      if (u.lv >= cap) u.exp = 0;
    }
  };

  B.kill = async function (u, by) {
    if (u.spare) {
      // some foes yield instead of dying
      u.hp = 1;
      if (u.deathLine && u.portId) await this.say([[u.portId, 'sad', u.deathLine]]);

      u.gone = true;
      await this.trigger({ dead: u.id });
      return;

    AD.audio.sfx('death');
    u.fade = 0;

    u.dead = true;
    if (u.team === 'p') {
      const d = AD.UNITS[u.id];

      await this.say([[u.id, 'sad', d.death || '...']]);

  B.giveItem = async function (u, it) {
    const d = AD.ITEMS[it.id];

    if (u.items.length < 5) { u.items.push(Object.assign({}, it)); await AD.notice('Got ' + d.n + '.', { icon: d.weapon ? d.t : d.song ? 'song' : 'item' }); }
    else { AD.game.toConvoy(it); await AD.notice(d.n + ' was sent to the convoy.', { icon: 'item' }); }

  // ---------------------------------------------------------------- other actions
  B.songFlow = async function (u) {
    const ss = songs(u).filter((so) => this.songTargets(u, so).length);
    let so = ss[0];
    if (ss.length > 1) {
      const v = await AD.menu({ items: ss.map((s) => ({ label: s.d.n, value: s.i, icon: 'song', right: s.it.uses, help: s.d.desc })) });
      if (v === null) return false;
      so = ss.find((s) => s.i === v);
    }
    const tgs = this.songTargets(u, so);
    let t = tgs[0];
    if (so.d.range !== 'area') {
      t = await this.pickTarget(u, tgs, (o) => so.d.range === 'fold' ? 'Fold ' + o.name + ' here' : so.d.buff ? 'Threadsight: ' + o.name : o.name + '  HP ' + o.hp + '/' + o.mhp);
      if (!t) return false;
    }
    u.items[so.i].uses--;
    AD.audio.sfx(so.d.range === 'fold' ? 'warp' : 'heal');
    const healAmt = (o) => {
      let h = stat(u, 'mag') + so.d.heal;
      if (so.d.id === 'duet' && this.alive('p').some((x) => x !== u && (x.id === 'noella' || x.id === 'sierra' || x.id === 'selenne') && man(x.x, x.y, o.x, o.y) <= 1)) h += 10;
      return h;
    };
    if (so.d.range === 'area') {
      this.alive().filter((o) => friends(o, u) && man(o.x, o.y, u.x, u.y) <= 3).forEach((o) => { const h = Math.min(o.mhp - o.hp, healAmt(o)); o.hp += h; if (h) AD.fx.float('+' + h, o.x * TS + 8, o.y * TS, C.hp); });
    } else if (so.d.range === 'fold') {
      const spot = DIRS.map(([dx, dy]) => [u.x + dx, u.y + dy]).find(([x, y]) => this.map.at(x, y) && TL.cost(this.map.at(x, y), 'foot') !== null && !this.unitAt(x, y));
      if (spot) { t.x = spot[0]; t.y = spot[1]; }
    } else if (so.d.buff) {
      t.buff = 1;
      this.alive('e').filter((e) => man(e.x, e.y, t.x, t.y) <= 3).forEach((e) => e.weak.forEach((w) => AD.game.learnWeak(e, w)));
      AD.fx.float('Threads!', t.x * TS + 8, t.y * TS, C.teal);
    } else {
      const h = Math.min(t.mhp - t.hp, healAmt(t));

      AD.fx.float('+' + h, t.x * TS + 8, t.y * TS, C.hp);
    }
    if (u.items[so.i].uses <= 0) u.items.splice(so.i, 1);
    u.wexp.song = (u.wexp.song || 0) + 2;
    await AD.wait(24);
    await this.giveExp(u, 12);
    AD.game.bumpSupportNear(u, this.alive('p'));
    return true;
  };

  B.stealable = function (o) { return o.items.map((it, i) => ({ it, i })).filter(({ i, it }) => i !== o.eq && AD.ITEMS[it.id] && !AD.ITEMS[it.id].pers); };
  B.stealFlow = async function (u) {

    if (v === null) return false;

  B.talkTargets = function (u) {

      const [a, b] = ev.when.talk;

  B.talkFlow = async function (u, talks) {

  B.visitFlow = async function (u) {
    const k = key(u.x, u.y);
    this.tstate.visited[k] = true;
    this.baked.rows[u.y] = TL.bakeRow(this.map, u.y, this.tstate);
    const hv = (this.ch.houses || {})[k];
    if (hv) {
      if (hv.say) await this.say(hv.say);
      if (hv.give) await this.giveItem(u, AD.item(hv.give));
      if (hv.gold) { AD.game.addGold(hv.gold); AD.audio.sfx('coin'); await AD.notice('Received ' + AD.fmt(hv.gold) + ' crowns.'); }
      if (hv.do) await this.runActions(hv.do);
    } else {
      await this.say([['@narrate', 'The family inside presses a few coins into your hand. "For the Rose," they whisper.']]);

  B.chestFlow = async function (u) {
    const k = key(u.x, u.y);
    if (!has(u, 'locktouch')) { const i = u.items.findIndex((x) => x.id === 'chestkey'); if (i >= 0) { u.items[i].uses--; if (u.items[i].uses <= 0) u.items.splice(i, 1); } }
    this.tstate.opened[k] = true;
    this.baked.rows[u.y] = TL.bakeRow(this.map, u.y, this.tstate);
    const c = (this.ch.chests || {})[k];
    if (c && c.gold) { AD.game.addGold(c.gold); AD.audio.sfx('coin'); await AD.notice('Found ' + AD.fmt(c.gold) + ' crowns.'); }
    else await this.giveItem(u, AD.item(c ? (c.id || c) : 'stack'));

    return true;
  };

  B.doorFlow = async function (u, doors) {
    const [x, y] = doors[0];
    if (!has(u, 'locktouch')) { const i = u.items.findIndex((it) => it.id === 'doorkey'); if (i >= 0) { u.items[i].uses--; if (u.items[i].uses <= 0) u.items.splice(i, 1); } }
    this.tstate.opened[key(x, y)] = true;
    AD.audio.sfx('door');

    return true;
  };

  B.buildSpots = function (u) { return DIRS.map(([dx, dy]) => [u.x + dx, u.y + dy]).filter(([x, y]) => { const ch = this.map.at(x, y); return (ch === '~' || ch === '-' || ch === 'r' || ch === 'x') && !this.unitAt(x, y); }); };
  B.buildFlow = async function (u) {
    const spots = this.buildSpots(u);
    const t = await this.pickTile(u, spots, 'Build here');
    if (!t) return false;
    const ch = this.map.at(t[0], t[1]);

    AD.audio.sfx('door');
    AD.fx.float('Built!', t[0] * TS + 8, t[1] * TS, C.gold);

  B.isExit = function (x, y) { return this.map.at(x, y) === '<' || (this.goal.exits || []).some(([ex, ey]) => ex === x && ey === y); };
  B.escape = async function (u) {
    u.gone = true; this.escaped.push(u);
    AD.audio.sfx('warp');

    await this.finish(u);

  B.tradeFlow = async function (u) {
    const t = await this.pickTarget(u, this.adjacent(u, (o) => o.team === 'p'), (o) => 'Trade with ' + o.name);
    if (!t) return;
    await AD.run(new AD.TradeScene(u, t));
    const eu = equipped(u); u.eq = eu ? eu.i : 0;
    const et = equipped(t); t.eq = et ? et.i : 0;
  };

  B.itemsFlow = async function (u) {
    for (;;) {
      if (!u.items.length) { await AD.notice('No items.'); return; }
      const v = await AD.menu({
        title: u.name, items: u.items.map((it, i) => {
          const d = AD.ITEMS[it.id];
          return { label: d.n, value: i, icon: d.weapon ? d.t : d.song ? 'song' : 'item', right: it.uses, help: d.desc || (d.weapon ? `Mt ${d.mt}  Hit ${d.hit}  Crit ${d.crt}  Wt ${d.wt}  Rng ${d.rng[0]}-${d.rng[1]}  Rank ${d.rank}` : ''), color: i === u.eq && d.weapon ? C.gold : undefined };
        }),
      });
      if (v === null) return;
      const d = AD.ITEMS[u.items[v].id];
      const acts = [];
      if (d.weapon && canUse(u, d.id)) acts.push({ label: 'Equip', value: 'equip' });
      if (d.kind === 'heal' && u.hp < u.mhp) acts.push({ label: 'Use', value: 'use' });
      if (d.kind === 'bp' && u.bp < 5) acts.push({ label: 'Use', value: 'use' });
      if (d.kind === 'stat' || d.kind === 'promo') acts.push({ label: 'Use', value: 'use' });
      acts.push({ label: 'Discard', value: 'drop' });
      const a = await AD.menu({ items: acts });
      if (a === 'equip') { const [it] = u.items.splice(v, 1); u.items.unshift(it); u.eq = 0; AD.audio.sfx('select'); continue; }
      if (a === 'drop') { if (await AD.confirm('Discard ' + d.n + '?')) u.items.splice(v, 1); continue; }
      if (a === 'use') {
        const r = await AD.game.useItem(u, v, this);
        if (r) return 'used';
      }
    }
  };

  // choose one of several units with the cursor
  B.pickTarget = function (u, list, label) {
    return new Promise((res) => {
      const sc = new Picker(this, list.map((o) => ({ x: o.x, y: o.y, o })), (p) => label(p.o));
      sc.done = (v) => { AD.pop(sc); res(v ? v.o : null); };
      AD.push(sc);
    });
  };
  B.pickTile = function (u, spots, label) {
    return new Promise((res) => {
      const sc = new Picker(this, spots.map(([x, y]) => ({ x, y })), () => label);
      sc.done = (v) => { AD.pop(sc); res(v ? [v.x, v.y] : null); };
      AD.push(sc);
    });
  };

  // ---------------------------------------------------------------- map menu
  B.mapMenu = async function () {
    const v = await AD.menu({
      items: [
        { label: 'End Turn', value: 'end' },
        { label: 'Objective', value: 'goal' },
        { label: 'Units', value: 'units' },
        { label: this.danger ? 'Hide Danger' : 'Danger Zone', value: 'danger' },
        { label: 'Options', value: 'opt' },
        { label: 'Suspend', value: 'suspend' },
      ], x: W - 92, y: 8, w: 84,
    });
    if (v === 'end') await this.endPlayerPhase();
    else if (v === 'goal') await AD.notice(this.goalText() + '\nTurn ' + this.turn + (this.goal.turns ? ' of ' + this.goal.turns : '') + '\n\n' + this.alive('p').length + ' allies \u00b7 ' + this.alive('e').filter((e) => this.visible(e.x, e.y)).length + ' foes in sight');
    else if (v === 'units') {
      const us = this.alive('p');
      const k = await AD.menu({ title: 'Units', items: us.map((u, i) => ({ label: u.name, value: i, right: u.hp + '/' + u.mhp, color: u.done ? C.dim : undefined })) });
      if (k !== null) { this.cursor.x = us[k].x; this.cursor.y = us[k].y; this.follow(us[k].x, us[k].y, 80); }
    } else if (v === 'danger') { this.danger = !this.danger; this.dz = null; }
    else if (v === 'opt') await AD.game.optionsMenu();
    else if (v === 'suspend') {
      if (await AD.confirm('Suspend and return to the title?')) { AD.game.suspend(this); this.over = true; AD.game.toTitle(); }
    }
  };
  B.goalText = function () {
    const g = this.goal;
    if (g.text) return g.text;
    switch (g.type) {
      case 'rout': return 'Defeat every enemy';
      case 'boss': return 'Defeat the commander';
      case 'seize': return 'Seize the marked point';
      case 'survive': return 'Survive ' + g.turns + ' turns';
      case 'escape': return 'Lead Abarax to the exit';
      case 'defend': return 'Defend for ' + g.turns + ' turns';
      default: return '';
    }
  };

  // ---------------------------------------------------------------- phases
  B.showBanner = function (text, color) {
    if (AD.TEST) return Promise.resolve();
    return new Promise((res) => { this.banner = { text, color, t: 0, life: 56, res }; AD.audio.sfx('turn'); });
  };
  B.beginPhase = async function (ph) {
    this.phase = ph;
    this.vis = null; this.dz = null;
    const team = this.alive(ph);
    team.forEach((u) => { u.done = false; u.skinUsed = false; });
    if (ph === 'p') {
      if (this.goal.type === 'survive' || this.goal.type === 'defend') {
        if (this.turn > this.goal.turns) { await this.win(); return; }
      }
      if (this.goal.limit && this.turn > this.goal.limit) { await this.say([['@narrate', 'Out of time.']]); await this.lose(); return; }
    }
    if (!team.length && ph !== 'p') return this.nextPhase();
    AD.audio.play(ph === 'p' ? (this.ch.music && this.ch.music.p) || 'player' : (this.ch.music && this.ch.music.e) || 'enemy');
    await this.showBanner(ph === 'p' ? 'PLAYER PHASE' : ph === 'e' ? 'ENEMY PHASE' : 'ALLY PHASE', ph === 'p' ? C.blue : ph === 'e' ? C.red : C.green);
    await this.phaseEffects(ph);
    await this.trigger({ turn: this.turn, phase: ph });
    if (await this.checkEnd()) return;
    if (ph === 'p' && this.autoplay && this.turn > (this.maxTurns || 30)) { this.over = true; this.autoResult = 'timeout'; return; }
    if (ph === 'p' && !this.autoplay) {
      const lord = this.lord();
      if (lord) { this.cursor.x = lord.x; this.cursor.y = lord.y; this.follow(lord.x, lord.y, 80); }
      this.state = 'map';
    } else {
      await this.aiPhase(ph);
      await this.nextPhase();
    }
  };
  B.nextPhase = async function () {
    if (this.over) return;
    const order = ['p', 'a', 'e'];
    let i = order.indexOf(this.phase);
    for (let k = 0; k < 3; k++) {
      i = (i + 1) % 3;
      if (i === 0) { this.turn++; return this.beginPhase('p'); }
      if (this.alive(order[i]).length) return this.beginPhase(order[i]);
    }
  };
  B.endPlayerPhase = async function () {
    this.state = 'busy';
    this.alive('p').forEach((u) => { u.done = true; });
    await this.nextPhase();
  };

  B.phaseEffects = async function (ph) {
    const team = this.alive(ph);
    for (const u of team) {
      let heal = 0;
      const t = this.terrain(u.x, u.y);
      if (t.heal) heal += Math.floor((u.mhp * t.heal) / 100);
      if (has(u, 'regen')) heal += Math.floor(u.mhp / 5);
      const lord = this.lord();
      if (lord && lord !== u && friends(u, lord) && has(lord, 'openhand') && man(u.x, u.y, lord.x, lord.y) === 1) heal += 3;
      if (this.alive().some((o) => o !== u && friends(o, u) && has(o, 'bloomground') && man(o.x, o.y, u.x, u.y) <= 2)) heal += 5;
      heal = Math.min(heal, u.mhp - u.hp);
      if (heal > 0 && u.hp > 0) { u.hp += heal; AD.fx.float('+' + heal, u.x * TS + 8, u.y * TS, C.hp); }
      if (u.silenced) u.silenced = Math.max(0, u.silenced - 1);
      u.buff = 0;
      if (ph === 'p' && u.team === 'p') { if (!u.boosted) u.bp = Math.min(5, u.bp + 1); u.boosted = false; }
      if (ph === 'p' && u.lord && this.ch.getupEveryTurn) u.gotUp = false;
      // break recovery
      if (u.broken) {
        if (u.brokeSkip > 0) { u.brokeSkip--; u.skipThis = true; }
        else { u.broken = false; u.shield = u.mshield; u.skipThis = false; AD.fx.float('Guard up', u.x * TS + 8, u.y * TS, C.gray); }
      } else u.skipThis = false;
    }
    // things from the Order
    for (const u of team.filter((x) => has(x, 'unmake'))) {
      const cand = [];
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const x = u.x + dx, y = u.y + dy, ch = this.map.at(x, y);
        if (ch && ch !== 'x' && !this.unitAt(x, y) && (dx || dy) && Math.abs(dx) + Math.abs(dy) <= 2) cand.push([x, y]);
      }
      for (let i = 0; i < 2 && cand.length; i++) { const [x, y] = cand.splice(Math.floor(AD.rng() * cand.length), 1)[0]; this.map.set(x, y, 'x'); }
      this.baked = TL.bake(this.map, this.tstate);
    }
    for (const u of team.filter((x) => has(x, 'seams'))) {
      const foes = this.alive().filter((o) => !friends(o, u));
      if (!foes.length) continue;
      const f = AD.pick(foes, AD.rng());
      const spot = [[1, 0], [-1, 0], [0, 1], [0, -1], [2, 0], [0, 2]].map(([dx, dy]) => [f.x + dx, f.y + dy]).find(([x, y]) => this.map.at(x, y) && TL.cost(this.map.at(x, y), 'phase') !== null && !this.unitAt(x, y));
      if (spot) { u.x = spot[0]; u.y = spot[1]; AD.audio.sfx('warp'); }
    }
    if (team.length) await AD.wait(10);
  };

  // ---------------------------------------------------------------- AI
  B.aiPhase = async function (ph) {
    const units = this.alive(ph).slice().sort((a, b) => (a.boss ? 1 : 0) - (b.boss ? 1 : 0));
    for (const u of units) {
      if (this.over) return;
      if (u.dead || u.gone || u.done) continue;
      if (u.skipThis) { AD.fx.float('Broken', u.x * TS + 8, u.y * TS, C.gold); u.done = true; await AD.wait(8); continue; }
      await this.aiAct(u);
      u.done = true;
      if (await this.checkEnd()) return;
    }
  };

  B.aiAct = async function (u) {
    let mode = u.ai;
    if (mode === 'wait') {
      // an explicit wake turn is a promise to the player; otherwise wake when someone comes close
      const awake = u.wake ? this.turn >= u.wake || u.hp < u.mhp : this.alive().some((o) => !friends(o, u) && man(o.x, o.y, u.x, u.y) <= u.mov + 2);
      if (!awake) return;
      u.ai = mode = 'charge';
    }
    if (mode === 'stay' || mode === 'npc') return;
    if (mode === 'flee') return this.aiFlee(u);
    const reach = mode === 'hold' ? new Map([[key(u.x, u.y), { c: 0, x: u.x, y: u.y, p: null }]]) : this.reach(u, u.mov);
    const spots = [];
    reach.forEach((v) => { const o = this.unitAt(v.x, v.y); if (!o || o === u) spots.push(v); });
    // healers first look after their own
    const ss = songs(u);
    if (ss.length) {
      let best = null;
      ss.forEach((so) => spots.forEach((v) => this.alive().forEach((o) => {
        if (!friends(o, u) || o === u || o.hp >= o.mhp * 0.75 || so.d.range === 'fold' || so.d.buff) return;
        if (man(v.x, v.y, o.x, o.y) > (so.d.range === 'far' ? 4 : so.d.range === 'area' ? 3 : so.d.range)) return;
        const sc = o.mhp - o.hp - v.c * 0.1;

  // ---------------------------------------------------------------- forecast scene

    const cur = this.ws.findIndex((w) => w.i === this.u.eq);

    const t = this.targets[this.ti];

    const d = I.dir();
    if (d && d[1]) { this.boost = AD.clamp(this.boost - d[1], 0, Math.min(3, this.u.bp)); AD.audio.sfx(d[1] < 0 ? 'boost' : 'cursor'); }
    if (d && d[0] && this.targets.length > 1) { this.ti = (this.ti + d[0] + this.targets.length) % this.targets.length; this.pickWeapons(); AD.audio.sfx('cursor'); }
    if ((I.pressed('l') || I.pressed('r')) && this.ws.length > 1) { this.wi = (this.wi + 1) % this.ws.length; AD.audio.sfx('cursor'); }
    if (I.wheel) { this.boost = AD.clamp(this.boost - I.wheel, 0, Math.min(3, this.u.bp)); }
    const c = I.consumeClick();

      if (c.y >= 116 && c.y < 128 && this.ws.length > 1) { this.wi = (this.wi + 1) % this.ws.length; AD.audio.sfx('cursor'); return; }

      const j = this.targets.findIndex((o) => o.x === tx && o.y === ty);

    }

  // ---------------------------------------------------------------- duel view
  // GBA-style side view: foe on the left, the Garden on the right.
  function Duel(bt, fc, res) {
    this.bt = bt; this.fc = fc; this.res = res; this.t = 0; this.k = 0; this.phase = 'in'; this.pt = 0;
    const L = fc.a.team === 'p' ? fc.d : fc.a, R = fc.a.team === 'p' ? fc.a : fc.d;
    this.L = L; this.R = R;
    this.hp = { [L.uid]: res.tl.length ? (res.tl[0].who === 'a' ? (L === fc.a ? res.tl[0].aHp : res.tl[0].before) : 0) : L.hp, [R.uid]: 0 };
    // starting hp is the hp before the first strike
    const startHp = (u) => {
      for (const ev of res.tl) {
        if (ev.broke_weapon) continue;
        const def = ev.who === 'a' ? fc.d : fc.a;
        if (def === u) return ev.before;
      }
      return u.hp;
    };
    this.hp[L.uid] = startHp(L); this.hp[R.uid] = startHp(R);
    this.shown = { [L.uid]: this.hp[L.uid], [R.uid]: this.hp[R.uid] };
    this.texts = [];
    this.biome = TL.BI[bt.map.biome] || TL.BI.city;
  }
  Duel.prototype.update = function () {
    this.t++;
    const sp = I.held.fast ? 3 : 1;
    [this.L, this.R].forEach((u) => { const tgt = this.hp[u.uid]; const s = this.shown[u.uid]; if (s !== tgt) this.shown[u.uid] = s > tgt ? Math.max(tgt, s - 0.5 * sp) : Math.min(tgt, s + 0.5 * sp); });
    this.texts.forEach((t) => { t.t++; t.y -= 0.4; });
    this.texts = this.texts.filter((t) => t.t < 50);
    if (this.phase === 'in') { if (this.t > 18) { this.phase = 'strike'; this.pt = 0; } return; }
    if (this.phase === 'strike') {
      const ev = this.res.tl[this.k];
      if (!ev) { this.phase = 'out'; this.pt = 0; return; }
      if (ev.broke_weapon) { this.texts.push({ s: ev.broke_weapon + ' broke!', x: W / 2, y: 60, c: C.rose, t: 0 }); this.k++; return; }
      this.pt += sp;
      const att = ev.who === 'a' ? this.fc.a : this.fc.d, def = ev.who === 'a' ? this.fc.d : this.fc.a;
      if (this.pt >= 14 && !ev.shown) {
        ev.shown = true;
        if (ev.hit) {
          AD.audio.sfx(ev.crit ? 'crit' : 'hit');
          this.hp[def.uid] = ev.after;
          if (ev.healed) this.hp[att.uid] = Math.min(att.mhp, this.hp[att.uid] + ev.healed);
          AD.fx.shake(ev.crit ? 5 : 2, ev.crit ? 16 : 8);
          if (ev.crit) AD.fx.flash('#ffffff', 10);
          const dx = def === this.L ? 92 : 228;
          this.texts.push({ s: String(ev.dmg), x: dx, y: 70, c: ev.crit ? C.gold : '#ffffff', t: 0 });
          if (ev.crit) this.texts.push({ s: 'CRITICAL', x: dx, y: 58, c: C.gold, t: 0 });
          if (ev.broke) { AD.audio.sfx('break'); this.texts.push({ s: 'BREAK!', x: dx, y: 46, c: C.gold, t: 0 }); this.breakFx = { x: dx, t: 0 }; }
          else if (ev.chip) this.texts.push({ s: 'Shield -' + ev.chip, x: dx, y: 46, c: '#c8d0e8', t: 0 });
          if (ev.getup) this.texts.push({ s: 'GET UP', x: dx, y: 46, c: C.rose, t: 0 });
          if (ev.drain) this.texts.push({ s: ev.drain.toUpperCase() + ' stolen', x: dx, y: 34, c: C.violet, t: 0 });
          if (ev.stop) this.texts.push({ s: 'STOPPED', x: dx, y: 34, c: C.gold, t: 0 });
          this.hitFlash = { u: def, t: 8 };
        } else {
          AD.audio.sfx('miss');

          this.dodge = { u: def, t: 12 };
        }
      }
      if (this.pt >= 34) { this.k++; this.pt = 0; }
