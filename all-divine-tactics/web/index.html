  AD.World = function () { this.opaque = true; this.t = 0; };
  AD.World.prototype.enter = function () {
    if (!worldCanvas) paintWorld();
    AD.audio.play('world');
    AD.fx.setWeather(null);
    const s = GM.state;
    this.node = AD.WORLD.nodes[s.node] ? s.node : 'bilibara';
    const n = AD.WORLD.nodes[this.node];
    this.px = n.x; this.py = n.y;
    this.cam = { x: n.x - W / 2, y: n.y - H / 2 };
    this.walking = null;
    this.busy = false;
  };
  AD.World.prototype.open = function (id) { return AD.worldOpen(id); };
  AD.World.prototype.links = function (id) { return AD.WORLD.nodes[id].links.filter((l) => this.open(l)); };
  AD.World.prototype.update = function () {
    this.t++;
    const tx = this.px - W / 2, ty = this.py - H / 2 - 10;
    this.cam.x += (AD.clamp(tx, 0, AD.WORLD.w - W) - this.cam.x) * 0.15;
    this.cam.y += (AD.clamp(ty, 0, AD.WORLD.h - H) - this.cam.y) * 0.15;
    if (this.walking) {
      const w = this.walking;
      w.t += I.held.fast ? 3 : 1;
      const a = AD.WORLD.nodes[w.path[w.i]], b = AD.WORLD.nodes[w.path[w.i + 1]];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      const k = Math.min(1, (w.t * 1.6) / len);
      this.px = a.x + (b.x - a.x) * k; this.py = a.y + (b.y - a.y) * k;
      this.dir = Math.abs(b.x - a.x) > Math.abs(b.y - a.y) ? (b.x > a.x ? 'right' : 'left') : b.y > a.y ? 'down' : 'up';
      if (k >= 1) {
        w.i++; w.t = 0;
        this.node = w.path[w.i]; GM.state.node = this.node;
        // a skirmish may find you on the road
        const road = AD.roadSkirmish && AD.roadSkirmish(a.id, b.id);
        if (road && w.i < w.path.length - 1 && AD.rng() < 0.18) { this.walking = null; this.busy = true; this.skirmish(road).then(() => { this.busy = false; }); return; }
        if (w.i >= w.path.length - 1) { this.walking = null; this.arrive(); }
      }
      return;
    }
    if (this.busy) return;
    const d = I.dir();
    if (d) {
      // pick the linked node whose direction best matches
      const here = AD.WORLD.nodes[this.node];
      let best = null;
      this.links(this.node).forEach((l) => {
        const n = AD.WORLD.nodes[l];
        const vx = n.x - here.x, vy = n.y - here.y, len = Math.hypot(vx, vy);
        const dot = (vx * d[0] + vy * d[1]) / len;
        if (dot > 0.35 && (!best || dot > best.dot)) best = { l, dot };
      });
      if (best) { AD.audio.sfx('step'); this.walking = { path: [this.node, best.l], i: 0, t: 0 }; }
    }
    const c = I.consumeClick();
    if (c) {
      const wx = c.x + this.cam.x, wy = c.y + this.cam.y;
      const hit = Object.values(AD.WORLD.nodes).find((n) => this.open(n.id) && Math.hypot(n.x - wx, n.y - wy) < 10);
      if (hit) {
        if (hit.id === this.node) { this.busy = true; this.nodeMenu().then(() => { this.busy = false; }); }
        else { const path = this.route(this.node, hit.id); if (path) { AD.audio.sfx('select'); this.walking = { path, i: 0, t: 0 }; } }
      }
    }
    if (I.pressed('a')) { this.busy = true; this.nodeMenu().then(() => { this.busy = false; }); }
    if (I.pressed('start') || I.pressed('b') || I.rclick) { this.busy = true; AD.campMenu().then(() => { this.busy = false; }); }
  };
  AD.World.prototype.route = function (a, b) {
    const prev = { [a]: null }, q = [a];
    while (q.length) {
      const n = q.shift();
      if (n === b) break;
      this.links(n).forEach((l) => { if (!(l in prev)) { prev[l] = n; q.push(l); } });
    }
    if (!(b in prev)) return null;
    const path = [];
    for (let n = b; n; n = prev[n]) path.unshift(n);
    return path;
  };

  AD.availableSupports = function () {
    const s = GM.state;
    const out = [];
    Object.entries(AD.SUPPORTS || {}).forEach(([k, conv]) => {
      const [a, b] = k.split('+');
      if (!GM.record(a) || !GM.record(b)) return;
      const pts = s.supports[k] || 0;
      const have = s.supportLv[k];
      const order = ['C', 'B', 'A'];
      const nextLv = order[have ? order.indexOf(have) + 1 : 0];
      if (!nextLv || !conv[nextLv]) return;
      const need = { C: 12, B: 30, A: 54 }[nextLv];
      if (pts >= need) out.push({ k, a, b, lv: nextLv, lines: conv[nextLv] });
    });
    return out;
  };

  AD.Town = function (id) {

    this.baked = TL.bake(this.map, this.tstate);
    const st = this.def.start;
    this.p = { x: st[0], y: st[1], px: st[0] * TS, py: st[1] * TS, dir: 'down', moving: false };
    this.cam = { x: 0, y: 0 };
    this.npcs = this.def.npcs.filter((n) => (!n.cond || n.cond()) && (!n.flag || GM.flag(n.flag)) && (!n.noflag || !GM.flag(n.noflag))).map((n) => Object.assign({ px: n.x * TS, py: n.y * TS, t: Math.random() * 100 }, n));
    this.busy = false;
    this.leader = 'abarax';
  };
  AD.Town.prototype.enter = function () {
    AD.audio.play(this.def.music || 'town');
    AD.fx.setWeather(this.def.weather || null, this.def.weatherDensity);
    if (!this.entered) {
      this.entered = true;
      const k = 'town:' + this.def.id;
      if (this.def.first && !GM.state.visited[k]) { GM.state.visited[k] = true; this.busy = true; AD.dialogue(this.def.first).then(() => { this.busy = false; }); }
    }
  };
  AD.Town.prototype.blocked = function (x, y) {
    const ch = this.map.at(x, y);
    if (ch === null) return true;
    if (TL.cost(ch, 'foot') === null) return true;
    if (this.npcs.some((n) => n.x === x && n.y === y)) return true;
    return false;
  };
  AD.Town.prototype.update = function () {
    const p = this.p;
    this.npcs.forEach((n) => {
      n.t++;
      if (n.wander && !this.busy && n.t % 140 === 0 && Math.random() < 0.6) {
        const [dx, dy] = AD.pick([[1, 0], [-1, 0], [0, 1], [0, -1]]);
        const nx = n.x + dx, ny = n.y + dy;
        if (!this.blocked(nx, ny) && !(nx === p.x && ny === p.y) && Math.abs(nx - n.home[0]) + Math.abs(ny - n.home[1]) <= 2) { n.x = nx; n.y = ny; n.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy > 0 ? 'down' : 'up'; }
      }
      if (!n.home) n.home = [n.x, n.y];
      n.px += (n.x * TS - n.px) * 0.2; n.py += (n.y * TS - n.py) * 0.2;
    });
    if (p.moving) {
      const sp = I.held.fast ? 4 : 2;
      const tx = p.x * TS, ty = p.y * TS;
      p.px += Math.sign(tx - p.px) * Math.min(sp, Math.abs(tx - p.px));
      p.py += Math.sign(ty - p.py) * Math.min(sp, Math.abs(ty - p.py));
      if (p.px === tx && p.py === ty) { p.moving = false; this.onStep(); }
    }
    this.cam.x = AD.clamp(p.px + 8 - W / 2, 0, Math.max(0, this.map.w * TS - W));
    this.cam.y = AD.clamp(p.py + 8 - H / 2, 0, Math.max(0, this.map.h * TS - H));
    if (this.map.w * TS < W) this.cam.x = (this.map.w * TS - W) / 2;
    if (this.map.h * TS < H) this.cam.y = (this.map.h * TS - H) / 2;
    if (this.busy || p.moving) return;
    const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    let mv = null;
    ['up', 'down', 'left', 'right'].forEach((k) => { if (I.held[k] && !mv) mv = k; });
    if (!mv && this.target) {
      const tx = this.target[0], ty = this.target[1];
      if (tx === p.x && ty === p.y) this.target = null;
      else mv = Math.abs(tx - p.x) > Math.abs(ty - p.y) ? (tx > p.x ? 'right' : 'left') : ty > p.y ? 'down' : 'up';
    }
    if (mv) {
      p.dir = mv;
      const [dx, dy] = dirs[mv];
      if (!this.blocked(p.x + dx, p.y + dy)) { p.x += dx; p.y += dy; p.moving = true; }

    if (n.shop) acts.push({ label: 'Shop', value: 'shop' });
    if (n.inn) acts.push({ label: 'Rest & Save', value: 'inn' });
    if (n.table) acts.push({ label: 'The Long Table', value: 'table' });

  AD.Town.prototype.draw = function (ctx) {

  AD.Prep = function (ch) {

  function Formation(prep) { this.prep = prep; this.bt = prep.battle; this.sel = null; this.cur = { x: prep.spots[0][0], y: prep.spots[0][1] }; }
  Formation.prototype.update = function () {

    if (c) { this.cur.x = Math.floor((c.x + bt.cam.x) / TS); this.cur.y = Math.floor((c.y + bt.cam.y) / TS); pick = true; }
    if (pick) {
      const si = this.prep.spots.findIndex(([x, y]) => x === this.cur.x && y === this.cur.y);
      if (si < 0) { AD.audio.sfx('cancel'); }
      else if (this.sel === null) { this.sel = si; AD.audio.sfx('select'); }
      else {
        const sp = this.prep.spots;

  Formation.prototype.draw = function (ctx) {
    const bt = this.bt;

    if (this.sel !== null) { const [x, y] = this.prep.spots[this.sel]; ctx.strokeStyle = C.gold; ctx.strokeRect(x * TS - bt.cam.x + 1.5, y * TS - bt.cam.y + 1.5, 13, 13); }
    G.panel(ctx, 60, 4, 200, 14); G.text(ctx, 'Pick two blue squares to swap. B when done.', 160, 7, C.cream, { align: 'center' });
  };
  function MapViewer(bt) { this.bt = bt; this.cur = { x: bt.cursor.x, y: bt.cursor.y }; }
  MapViewer.prototype.update = function () {
    const bt = this.bt;
    const d = I.dir();
    if (d) { this.cur.x = AD.clamp(this.cur.x + d[0], 0, bt.map.w - 1); this.cur.y = AD.clamp(this.cur.y + d[1], 0, bt.map.h - 1); bt.follow(this.cur.x, this.cur.y, 40); }
    const m = I.mouse;

      while (x !== tx) { rows[y][x] = rows[y][x] === '#' ? floorCh : rows[y][x]; x += Math.sign(tx - x); }
      while (y !== ty) { rows[y][x] = rows[y][x] === '#' ? floorCh : rows[y][x]; y += Math.sign(ty - y); }
    }
    const first = rooms[0], last = rooms[rooms.length - 1];
    const deploy = [];
    for (let y = first.y; y < first.y + first.h; y++) for (let x = first.x; x < first.x + first.w; x++) deploy.push([x, y]);
    const sx = last.x + last.w - 1, sy = last.y + Math.floor(last.h / 2);
    const boss = floor === dg.floors - 1;
    if (!boss) rows[sy][sx] = '<';
    // decor and loot
    rooms.slice(1).forEach((rm) => {
      if (r() < 0.5) { const x = rm.x + Math.floor(r() * rm.w), y = rm.y + Math.floor(r() * rm.h); if (rows[y][x] === floorCh) rows[y][x] = dg.biome === 'hills' ? 'o' : dg.biome === 'garden' ? 'k' : 'P'; }
      if (r() < 0.25) { const x = rm.x + Math.floor(r() * rm.w), y = rm.y + Math.floor(r() * rm.h); if (rows[y][x] === floorCh) rows[y][x] = 'r'; }
    });
    const chests = {};
    rooms.slice(1).forEach((rm, i) => {
      if (r() < 0.55 || i === 2) {
        const x = rm.x + Math.floor(r() * rm.w), y = rm.y;
        if (rows[y][x] === floorCh) { rows[y][x] = 'C'; chests[x + ',' + y] = AD.pick(dg.loot, r()); }
      }
    });
    const lv = dg.lv + floor * 2 + Math.max(0, partyLevel() - dg.lv - 4);
    const units = [];
    rooms.slice(1).forEach((rm) => {
      const n = 1 + Math.floor(r() * 2) + (GM.diff() >= 2 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const x = rm.x + Math.floor(r() * rm.w), y = rm.y + Math.floor(r() * rm.h);
        if (rows[y][x] !== floorCh || units.some((u) => u.x === x && u.y === y)) continue;
        units.push({ c: AD.pick(dg.foes, r()), lv: lv + Math.floor(r() * 3) - 1, x, y, ai: 'wait', drop: r() < 0.2 });
      }
    });
    if (boss) units.push(Object.assign({ lv: lv + 4, x: sx, y: sy, boss: true, ai: 'guard', drop: false }, dg.boss));
    return {
      id: 'dungeon', n: 0, title: dg.name + ' \u2014 Floor ' + (floor + 1), dungeon: dg.id, floor, loc: dg.loc,
      map: { biome: dg.biome, rows: rows.map((rw) => rw.join('')), fog: true, night: dg.biome !== 'garden', ambient: dg.biome === 'garden' ? 'rgba(30,10,60,0.35)' : 'rgba(6,6,16,0.5)' },
      units, deploy: deploy.slice(0, 10), max: 8, chests,
      goal: boss ? { type: 'boss', text: 'Defeat ' + dg.boss.name } : (floor % 2 ? { type: 'escape', text: 'Reach the stairs down' } : { type: 'rout', text: 'Clear the floor' }),
      reward: 200 + floor * 100,
      music: boss ? { p: 'boss', e: 'boss' } : null,
      dungeonDone(battle) {
        const s = GM.state;
        s.dungeons[dg.id] = boss ? 0 : floor + 1;
        if (boss) { s.flags['dungeon_' + dg.id] = true; GM.toConvoy(AD.item(dg.prize)); }
        void battle;
      },
      after: boss ? [['@narrate', 'The way through is open. Something glints where ' + dg.boss.name + ' stood.'], ['@narrate', AD.ITEMS[dg.prize].n + ' was added to the convoy.']] : null,
    };
  };
  AD.enterDungeon = async function (id) {
    const dg = AD.DUNGEONS.find((d) => d.id === id);
    const floor = GM.state.dungeons[id] || 0;
    if (floor > 0) {
      const v = await AD.menu({ title: dg.name, items: [{ label: 'Go down to floor ' + (floor + 1), value: 'go' }, { label: 'Start again from the top', value: 'top' }, { label: 'Not yet', value: null }] });

    const ch = AD.genDungeonFloor(dg, GM.state.dungeons[id] || 0);
